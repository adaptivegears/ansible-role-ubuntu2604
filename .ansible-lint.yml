---
# Ansible-lint configuration for this collection repository.
# See: https://docs.ansible.com/projects/lint/configuring/

profile: production

offline: true

# The role requires 2.20; the linter's built-in version list still ends at 2.19.
supported_ansible_also:
  - "2.20"

exclude_paths:
  - .cache/

warn_list:
  - experimental
  - jinja[spacing]
  - fqcn[deep]
