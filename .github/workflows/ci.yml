---
name: CI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Ansible Galaxy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tag matches the collection version
        run: |
          version=$(awk '/^version:/ { print $2 }' galaxy.yml)
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match galaxy.yml version $version" >&2
            exit 1
          fi

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'

      - name: Check, build, and publish the collection
        run: make publish
        env:
          ANSIBLE_GALAXY_SERVER_LIST: galaxy
          ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/
          ANSIBLE_GALAXY_SERVER_GALAXY_TOKEN: ${{ secrets.GALAXY_API_KEY }}
