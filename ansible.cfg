[defaults]
# Find make deps collections without losing the standard user/system paths.
collections_path = ./.ansible/collections:~/.ansible/collections:/usr/share/ansible/collections

# Fail unreachable hosts quickly so connection setup does not stall runs.
timeout = 10

# Use OpenSSH so native multiplexing can be reused.
transport = ssh

[ssh_connection]
# Reuse one SSH master per host across task/test bursts.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=10m -o PreferredAuthentications=publickey -o GSSAPIAuthentication=no

# Hash control sockets to avoid Unix path-length failures.
control_path_dir = ~/.ansible/cp
control_path = %(directory)s/%%C

# Pipeline modules over SSH to avoid SFTP/SCP round trips.
pipelining = True

# Retry transient connection setup failures without hiding persistent SSH issues.
retries = 2
