[defaults]
# Keep failed or unreachable hosts from blocking connection setup for too long.
timeout = 10

# Use the OpenSSH connection plugin so Ansible can reuse native multiplexed sessions.
transport = ssh

[ssh_connection]
# Reuse one authenticated SSH master connection per host instead of handshaking for
# every task, and keep it warm long enough for repeated playbook/test runs.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=10m -o PreferredAuthentications=publickey -o GSSAPIAuthentication=no

# Use Ansible-managed, hashed control socket paths to avoid Unix path-length
# failures when inventories contain long hostnames or usernames.
control_path_dir = ~/.ansible/cp
control_path = %(directory)s/%%C

# Send module payloads over the existing SSH session to remove extra SFTP/SCP
# setup round trips on each task.
pipelining = True

# Retry transient connection setup failures without hiding persistent SSH issues.
retries = 2
