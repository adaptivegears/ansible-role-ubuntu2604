---
- name: Install local infrastructure instructions for agents
  hosts: localhost
  connection: local
  # Gather facts before escalation so the skill defaults to the invoking account.
  pre_tasks:
    - name: Local | Identify provisioning user
      ansible.builtin.set_fact:
        ansible_user: "{{ ansible_facts['user_id'] }}"
      tags: always
  roles:
    - andreygubarev.com.agents
