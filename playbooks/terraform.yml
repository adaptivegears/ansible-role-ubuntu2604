---
- name: Provision local OpenTofu and Terragrunt tooling
  hosts: localhost
  connection: local
  # Gather facts before escalation so tools default to the invoking account.
  pre_tasks:
    - name: Local | Identify provisioning user
      ansible.builtin.set_fact:
        ansible_user: "{{ ansible_facts['user_id'] }}"
      tags: always
  roles:
    - andreygubarev.com.terraform
