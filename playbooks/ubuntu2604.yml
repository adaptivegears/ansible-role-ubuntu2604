---
- name: Provision the local Ubuntu 26.04 container-worker host
  hosts: localhost
  connection: local
  # Resolve the invoking account after gathering facts, before role SSH guardrails run.
  pre_tasks:
    - name: Local | Identify provisioning user
      ansible.builtin.set_fact:
        ansible_user: "{{ ansible_facts['user_id'] }}"
      tags: always
  roles:
    - andreygubarev.com.ubuntu2604
