---
# -----------------------------------------------------------------------------
# BB user
# -----------------------------------------------------------------------------
# Keep server state and provider credentials in a dedicated account. Full sudo
# is intentional: trusted agents may administer the host, not just the workspace.
# -----------------------------------------------------------------------------

- name: BB user | Configure the service account
  become: true
  tags: bb
  block:
    - name: BB user | Create the primary group
      ansible.builtin.group:
        name: bb
        state: present

    - name: BB user | Create the account with a locked password
      ansible.builtin.user:
        name: bb
        group: bb
        home: /home/bb
        shell: /bin/bash
        create_home: true
        password_lock: true
      register: agents__bb_user

    - name: BB user | Protect the home directory
      ansible.builtin.file:
        path: /home/bb
        state: directory
        owner: bb
        group: bb
        mode: "0700"

    - name: BB user | Allow passwordless host administration
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-agents-bb
        content: |
          # Source: https://github.com/andreygubarev/ansible-collection
          bb ALL=(ALL:ALL) NOPASSWD: ALL
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: BB user | Create the private server data directory
      ansible.builtin.file:
        path: /home/bb/.bb
        state: directory
        owner: bb
        group: bb
        mode: "0700"
