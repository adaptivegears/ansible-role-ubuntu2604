---
kubernetes_version: "1.37"
kubernetes_cluster_name: "kubernetes"
kubernetes_advertise_address: "{{ ansible_facts.get('default_ipv4', {}).get('address', '') }}"
kubernetes_pod_subnet: "10.244.0.0/16"
kubernetes_service_subnet: "10.96.0.0/16"
kubernetes_kubeconfig_user: "{{ ansible_user | default(ansible_ssh_user | default('')) }}"
kubernetes_apiserver_gogc: "50"
kubernetes_apiserver_gomemlimit: ""
kubernetes_flannel_manifest_url: "https://github.com/flannel-io/flannel/releases/download/v0.28.10/kube-flannel.yml"
kubernetes_metrics_server_version: "v0.9.0"
