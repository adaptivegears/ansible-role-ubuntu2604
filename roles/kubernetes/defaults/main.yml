---
# Mandatory on first use; saved identity is reused on subsequent runs.
kubernetes_cluster_name: "{{ kubernetes__facts.get('cluster_name', '') }}"

# Explicit inventory/playbook/CLI values override these saved-value fallbacks.
kubernetes_version: "{{ kubernetes__facts.get('kubernetes_version', '1.37') }}"
kubernetes_advertise_address: >-
  {{ kubernetes__facts.get('advertise_address', ansible_facts.get('default_ipv4', {}).get('address', '')) }}
kubernetes_pod_subnet: "{{ kubernetes__facts.get('pod_subnet', '10.244.0.0/16') }}"
kubernetes_service_subnet: "{{ kubernetes__facts.get('service_subnet', '10.96.0.0/16') }}"
kubernetes_kubeconfig_user: >-
  {{ kubernetes__facts.get('kubeconfig_user', ansible_user | default(ansible_ssh_user | default(''))) }}
kubernetes_apiserver_gogc: "{{ kubernetes__facts.get('apiserver_gogc', '50') }}"
kubernetes_apiserver_gomemlimit: "{{ kubernetes__facts.get('apiserver_gomemlimit', '') }}"
kubernetes_flannel_manifest_url: >-
  {{ kubernetes__facts.get('flannel_manifest_url',
     'https://github.com/flannel-io/flannel/releases/download/v0.28.10/kube-flannel.yml') }}
kubernetes_metrics_server_version: "{{ kubernetes__facts.get('metrics_server_version', 'v0.9.0') }}"
