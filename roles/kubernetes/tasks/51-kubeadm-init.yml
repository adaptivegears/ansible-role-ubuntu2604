---
# -----------------------------------------------------------------------------
# Cluster initialization
# -----------------------------------------------------------------------------
# Bootstrap only when the admin kubeconfig initialization marker is absent.
# -----------------------------------------------------------------------------

- name: Kubeadm | Initialize cluster
  become: true
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  changed_when: true
  when: not kubernetes__admin_conf.stat.exists
  tags: kubeadm
