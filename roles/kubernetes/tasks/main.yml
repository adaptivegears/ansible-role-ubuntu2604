---
# -----------------------------------------------------------------------------
# Prerequisite
# -----------------------------------------------------------------------------
# Fail before mutation on unsupported hosts and settle first-boot package work so
# the role can be used directly on fresh Ubuntu images or after a base role.
# -----------------------------------------------------------------------------

- name: Prerequisite | Assert OS is Ubuntu 26.04
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_version'] == "26.04"
    fail_msg: >-
      This role requires Ubuntu 26.04
      (detected {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})
    success_msg: "OS check passed: Ubuntu 26.04"

- name: Prerequisite | Assert architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ["x86_64", "aarch64"]
    fail_msg: >-
      This role requires amd64 or arm64 architecture
      (detected {{ ansible_facts['architecture'] }})
    success_msg: "Architecture check passed: {{ ansible_facts['architecture'] }}"

- name: Prerequisite | Assert API advertise address is known
  ansible.builtin.assert:
    that:
      - kubernetes_advertise_address | length > 0
    fail_msg: >-
      kubernetes_advertise_address is required. Set it explicitly when the host
      has no default IPv4 fact or when the Kubernetes API should use a specific
      public or private address.
    success_msg: "Kubernetes API advertise address: {{ kubernetes_advertise_address }}"

- name: Prerequisite | Select kubeconfig owner
  ansible.builtin.set_fact:
    kubernetes__kubeconfig_user: "{{ kubernetes_kubeconfig_user }}"

- name: Prerequisite | Assert kubeconfig owner is known
  ansible.builtin.assert:
    that:
      - kubernetes__kubeconfig_user | length > 0
    fail_msg: >-
      kubernetes_kubeconfig_user is required. Set it to an existing local user
      that should receive /home/<user>/.kube/config, or to root for /root.
    success_msg: "Kubeconfig owner: {{ kubernetes__kubeconfig_user }}"

- name: Prerequisite | Read stored cluster facts
  ansible.builtin.set_fact:
    kubernetes__cluster_facts: >-
      {{ ansible_facts.get('ansible_local', {}).get('kubernetes', {}).get('cluster', {}) }}

- name: Prerequisite | Assert immutable cluster identity matches stored facts
  ansible.builtin.assert:
    that:
      - kubernetes__cluster_facts.get('cluster_name', '') | length > 0
      - kubernetes__cluster_facts.get('kubernetes_version', '') | length > 0
      - kubernetes__cluster_facts.get('pod_subnet', '') | length > 0
      - kubernetes__cluster_facts.get('service_subnet', '') | length > 0
      - kubernetes__cluster_facts['cluster_name'] == kubernetes_cluster_name
      - kubernetes__cluster_facts['kubernetes_version'] == kubernetes_version
      - kubernetes__cluster_facts['pod_subnet'] == kubernetes_pod_subnet
      - kubernetes__cluster_facts['service_subnet'] == kubernetes_service_subnet
    fail_msg: >-
      Refusing to proceed because immutable Kubernetes cluster identity does not
      match /etc/ansible/facts.d/kubernetes.fact. Stored cluster name={{ kubernetes__cluster_facts.get('cluster_name', '<missing>') }},
      requested cluster name={{ kubernetes_cluster_name }}; stored Kubernetes version={{ kubernetes__cluster_facts.get('kubernetes_version', '<missing>') }},
      requested Kubernetes version={{ kubernetes_version }}; stored pod subnet={{ kubernetes__cluster_facts.get('pod_subnet', '<missing>') }},
      requested pod subnet={{ kubernetes_pod_subnet }}; stored service subnet={{ kubernetes__cluster_facts.get('service_subnet', '<missing>') }},
      requested service subnet={{ kubernetes_service_subnet }}. Rebuilding the cluster or using an explicit upgrade workflow is required to change these values.
    success_msg: "Immutable Kubernetes cluster identity matches stored facts"
  when: kubernetes__cluster_facts | length > 0

- name: Prerequisite | Ensure local facts directory exists
  become: true
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Prerequisite | Store immutable cluster networking facts
  become: true
  ansible.builtin.copy:
    dest: /etc/ansible/facts.d/kubernetes.fact
    content: |
      # Managed by ansible-role-kubernetes
      # Source: https://github.com/andreygubarev/ansible-collection

      [cluster]
      cluster_name={{ kubernetes_cluster_name }}
      kubernetes_version={{ kubernetes_version }}
      pod_subnet={{ kubernetes_pod_subnet }}
      service_subnet={{ kubernetes_service_subnet }}
    owner: root
    group: root
    mode: "0644"
  register: kubernetes__local_facts_file
  when: kubernetes__cluster_facts | length == 0

- name: Prerequisite | Re-read local facts after first-run storage
  ansible.builtin.setup:
    filter: ansible_local
  when:
    - kubernetes__local_facts_file is changed
    - not ansible_check_mode

- name: Prerequisite | Read kubeconfig owner account
  ansible.builtin.getent:
    database: passwd
    key: "{{ kubernetes__kubeconfig_user }}"

- name: Prerequisite | Record kubeconfig owner account details
  ansible.builtin.set_fact:
    kubernetes__kubeconfig_home: "{{ ansible_facts.getent_passwd[kubernetes__kubeconfig_user][4] }}"
    kubernetes__kubeconfig_group: "{{ ansible_facts.getent_passwd[kubernetes__kubeconfig_user][2] }}"

- name: Prerequisite | Get cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: kubernetes__cloud_init

- name: Prerequisite | Wait for cloud-init to finish
  ansible.builtin.command:
    argv:
      - timeout
      - "1800"
      - /usr/bin/cloud-init
      - status
      - --wait
  register: kubernetes__cloud_init_timeout
  # This is an APT-lock barrier; rc=1 can mean cloud-init is done but recorded errors.
  failed_when: kubernetes__cloud_init_timeout.rc not in [0, 1, 2]
  changed_when: false
  when: kubernetes__cloud_init.stat.exists

- name: Prerequisite | Report cloud-init completed with errors
  ansible.builtin.debug:
    msg: >-
      cloud-init completed with errors before this role started. Continuing
      because boot-time package work is no longer running; inspect
      'cloud-init status --long' and /var/log/cloud-init.log for root cause.
  when:
    - kubernetes__cloud_init.stat.exists
    - kubernetes__cloud_init_timeout.rc == 1

- name: Prerequisite | Update package cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Prerequisite | Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    install_recommends: false
    lock_timeout: 600
  tags: packages

# -----------------------------------------------------------------------------
# Swap
# -----------------------------------------------------------------------------
# Kubelet expects memory pressure to be handled by cgroups and Kubernetes
# eviction policy; host swap makes pod latency and OOM behavior unpredictable.
# -----------------------------------------------------------------------------

- name: Swap | Disable active swap
  become: true
  ansible.builtin.command: swapoff -a
  changed_when: false
  tags: swap

- name: Swap | Check for active swap entries in fstab
  become: true
  ansible.builtin.command:
    cmd: grep -E "^[[:space:]]*[^#[:space:]][^[:space:]]*[[:space:]]+[^[:space:]]+[[:space:]]+swap[[:space:]]" /etc/fstab
  register: kubernetes__fstab_active_swap
  failed_when: false
  changed_when: false
  tags: swap

- name: Swap | Remove swap entries from fstab
  become: true
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\sswap\s.*)$'
    replace: '# Disabled by ansible-role-kubernetes (https://github.com/andreygubarev/ansible-collection): \1'
    backup: true
  when: kubernetes__fstab_active_swap.rc == 0
  tags: swap

# -----------------------------------------------------------------------------
# Kernel
# -----------------------------------------------------------------------------
# Kubernetes networking relies on overlay filesystems, bridge packet filtering,
# and IPv4 forwarding being present before kubelet and CNI components start.
# -----------------------------------------------------------------------------

- name: Kernel | Persist Kubernetes kernel modules
  become: true
  ansible.builtin.copy:
    dest: /etc/modules-load.d/99-kubernetes.conf
    content: |
      # Managed by ansible-role-kubernetes
      # Source: https://github.com/andreygubarev/ansible-collection

      # Require OverlayFS explicitly for containerd overlay snapshotters.
      overlay
      # Route bridged pod traffic through host netfilter policy.
      br_netfilter
    owner: root
    group: root
    mode: "0644"
  tags: kernel

- name: Kernel | Load Kubernetes kernel modules
  become: true
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  tags: kernel

- name: Kernel | Configure Kubernetes sysctls
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      # Managed by ansible-role-kubernetes
      # Source: https://github.com/andreygubarev/ansible-collection

      # Send bridged pod IPv4 packets through iptables so Kubernetes Services work.
      net.bridge.bridge-nf-call-iptables = 1
      # Keep IPv6 bridge filtering aligned when dual-stack support is added later.
      net.bridge.bridge-nf-call-ip6tables = 1
      # Let pods and Services route through the node network namespace.
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"
  tags: kernel

- name: Kernel | Apply Kubernetes sysctls
  become: true
  ansible.builtin.command: sysctl --load /etc/sysctl.d/99-kubernetes.conf
  changed_when: false
  tags: kernel

# -----------------------------------------------------------------------------
# Containerd
# -----------------------------------------------------------------------------
# kubeadm and kubelet need a CRI runtime with systemd cgroups so pod accounting
# matches Ubuntu's unified cgroup hierarchy and service manager behavior.
# -----------------------------------------------------------------------------

- name: Containerd | Install runtime packages
  become: true
  ansible.builtin.apt:
    name:
      - containerd
      - containernetworking-plugins
    state: present
    install_recommends: true
    lock_timeout: 600
  tags: [containerd, packages]

- name: Containerd | Ensure configuration directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/containerd
    - /etc/containerd/conf.d
  tags: containerd

- name: Containerd | Configure root configuration
  become: true
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: |
      # Managed by ansible-role-kubernetes
      # Source: https://github.com/andreygubarev/ansible-collection

      # Ubuntu 26.04's containerd package starts from built-in defaults and ships
      # no /etc/containerd tree; this tiny root config preserves those defaults
      # while activating role-owned drop-ins.
      version = 3
      imports = ["/etc/containerd/conf.d/*.toml"]
    owner: root
    group: root
    mode: "0644"
  register: kubernetes__containerd_root_config
  tags: containerd

- name: Containerd | Configure Kubernetes runtime settings
  become: true
  ansible.builtin.copy:
    dest: /etc/containerd/conf.d/99-kubernetes.toml
    content: |
      # Managed by ansible-role-kubernetes
      # Source: https://github.com/andreygubarev/ansible-collection

      [plugins."io.containerd.cri.v1.images".pinned_images]
        sandbox = "registry.k8s.io/pause:3.10.2"

      [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc]
        runtime_type = "io.containerd.runc.v2"

      [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc.options]
        SystemdCgroup = true
    owner: root
    group: root
    mode: "0644"
  register: kubernetes__containerd_kubernetes_config
  tags: containerd

- name: Containerd | Validate runtime configuration
  become: true
  ansible.builtin.command:
    cmd: containerd --config /etc/containerd/config.toml config dump
  changed_when: false
  tags: containerd

- name: Containerd | Ensure runtime is active
  become: true
  ansible.builtin.systemd_service:
    name: containerd
    state: "{{ (kubernetes__containerd_root_config.changed or kubernetes__containerd_kubernetes_config.changed) | ternary('restarted', 'started') }}"
    enabled: true
  tags: containerd

- name: Containerd | Check packaged CNI path
  ansible.builtin.stat:
    path: /usr/lib/cni
  register: kubernetes__usr_lib_cni
  tags: containerd

- name: Containerd | Check Kubernetes CNI path
  ansible.builtin.stat:
    path: /opt/cni/bin
  register: kubernetes__opt_cni_bin
  tags: containerd

- name: Containerd | Ensure Kubernetes CNI parent exists
  become: true
  ansible.builtin.file:
    path: /opt/cni
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - kubernetes__usr_lib_cni.stat.exists
    - not kubernetes__opt_cni_bin.stat.exists
  tags: containerd

- name: Containerd | Link Debian-style CNI path for Kubernetes
  become: true
  ansible.builtin.file:
    src: /usr/lib/cni
    dest: /opt/cni/bin
    state: link
  when:
    - kubernetes__usr_lib_cni.stat.exists
    - not kubernetes__opt_cni_bin.stat.exists
  tags: containerd

# -----------------------------------------------------------------------------
# Packages
# -----------------------------------------------------------------------------
# Use Kubernetes' upstream repository for kubeadm/kubelet/kubectl so the node can
# track a chosen minor release instead of Ubuntu archive package cadence.
# -----------------------------------------------------------------------------

- name: Packages | Ensure APT keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: packages

- name: Packages | Install Kubernetes repository key
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    owner: root
    group: root
    mode: "0644"
  register: kubernetes__apt_key
  tags: packages

- name: Packages | Configure Kubernetes repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.sources
    content: |
      # Managed by ansible-role-kubernetes
      # Source: https://github.com/andreygubarev/ansible-collection

      Types: deb
      URIs: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/
      Suites: /
      Signed-By: /etc/apt/keyrings/kubernetes.asc
    owner: root
    group: root
    mode: "0644"
  register: kubernetes__apt_source
  tags: packages

- name: Packages | Install Kubernetes packages
  become: true
  ansible.builtin.apt:
    name:
      - kubeadm
      - kubectl
      - kubelet
    state: present
    install_recommends: true
    update_cache: true
    cache_valid_time: "{{ (kubernetes__apt_key is changed or kubernetes__apt_source is changed) | ternary(0, 3600) }}"
    lock_timeout: 600
  tags: packages

- name: Packages | Hold Kubernetes packages
  become: true
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubectl
    - kubelet
  tags: packages

# -----------------------------------------------------------------------------
# Kubelet
# -----------------------------------------------------------------------------
# Enable kubelet before initialization so kubeadm can hand static pod ownership
# to the service immediately after writing manifests.
# -----------------------------------------------------------------------------

- name: Kubelet | Enable service
  become: true
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
  tags: kubelet

# -----------------------------------------------------------------------------
# Kubeadm
# -----------------------------------------------------------------------------
# /etc/kubernetes/kubeadm-config.yaml is the declarative control-plane
# configuration. The first run initializes the cluster from it exactly once
# (re-running kubeadm init over an existing control plane can destroy cluster
# state, so the admin kubeconfig is the initialization marker). Later runs
# converge the running control plane on file changes through kubeadm's
# reconfigure flow: upload the config to the kubeadm-config ConfigMap so
# kubeadm upgrade preserves it, regenerate the control-plane static pod
# manifests, and wait for the API server to come back.
# -----------------------------------------------------------------------------

- name: Kubeadm | Check if cluster is already initialized
  become: true
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubernetes__admin_conf
  tags: kubeadm

- name: Kubeadm | Ensure configuration directory exists
  become: true
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: kubeadm

- name: Kubeadm | Pull control-plane images
  become: true
  ansible.builtin.command:
    cmd: kubeadm config images pull
  changed_when: true
  when: not kubernetes__admin_conf.stat.exists
  tags: kubeadm

- name: Kubeadm | Read installed kubeadm version
  become: true
  ansible.builtin.command:
    cmd: kubeadm version -o short
  register: kubernetes__kubeadm_version
  check_mode: false
  changed_when: false
  tags: kubeadm

- name: Kubeadm | Configure cluster
  become: true
  ansible.builtin.copy:
    dest: /etc/kubernetes/kubeadm-config.yaml
    content: |
      ---
      # Managed by ansible-role-kubernetes
      # Source: https://github.com/andreygubarev/ansible-collection
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      localAPIEndpoint:
        advertiseAddress: "{{ kubernetes_advertise_address }}"
        bindPort: 6443
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
      ---
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      clusterName: "{{ kubernetes_cluster_name }}"
      # Pinned to the installed kubeadm binary so config uploads and manifest
      # regeneration never resolve a version label over the network and never
      # generate manifests at a version other than the cluster's.
      kubernetesVersion: "{{ kubernetes__kubeadm_version.stdout }}"
      controlPlaneEndpoint: "{{ kubernetes_advertise_address }}:6443"
      networking:
        podSubnet: "{{ kubernetes_pod_subnet }}"
        serviceSubnet: "{{ kubernetes_service_subnet }}"
      apiServer:
        certSANs:
          - "{{ kubernetes_advertise_address }}"
        extraArgs:
          - name: bind-address
            value: "{{ kubernetes_advertise_address }}"
      {% if kubernetes_apiserver_gogc or kubernetes_apiserver_gomemlimit %}
        extraEnvs:
      {% if kubernetes_apiserver_gogc %}
          - name: GOGC
            value: "{{ kubernetes_apiserver_gogc }}"
      {% endif %}
      {% if kubernetes_apiserver_gomemlimit %}
          - name: GOMEMLIMIT
            value: "{{ kubernetes_apiserver_gomemlimit }}"
      {% endif %}
      {% endif %}
      ---
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      cgroupDriver: systemd
    owner: root
    group: root
    mode: "0644"
  register: kubernetes__kubeadm_config
  tags: kubeadm

- name: Kubeadm | Initialize cluster
  become: true
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  changed_when: true
  when: not kubernetes__admin_conf.stat.exists
  tags: kubeadm

- name: Kubeadm | Upload configuration to cluster
  become: true
  ansible.builtin.command:
    cmd: kubeadm init phase upload-config kubeadm --config /etc/kubernetes/kubeadm-config.yaml
  changed_when: true
  when:
    - kubernetes__admin_conf.stat.exists
    - kubernetes__kubeadm_config is changed
  tags: kubeadm

- name: Kubeadm | Regenerate control-plane manifests
  become: true
  ansible.builtin.command:
    cmd: kubeadm init phase control-plane all --config /etc/kubernetes/kubeadm-config.yaml
  changed_when: true
  when:
    - kubernetes__admin_conf.stat.exists
    - kubernetes__kubeadm_config is changed
  tags: kubeadm

- name: Kubeadm | Wait for control-plane restart
  # Kubelet needs a moment to pick up the regenerated static pod manifests and
  # terminate the old API server; polling /readyz immediately can catch the old
  # process and report readiness before the restart has even begun.
  ansible.builtin.pause:
    seconds: 30
  when:
    - kubernetes__admin_conf.stat.exists
    - kubernetes__kubeadm_config is changed
  tags: kubeadm

- name: Kubeadm | Wait for API server readiness
  become: true
  ansible.builtin.command:
    cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz
  register: kubernetes__apiserver_readyz
  until: kubernetes__apiserver_readyz.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  when:
    - kubernetes__admin_conf.stat.exists
    - kubernetes__kubeadm_config is changed
  tags: kubeadm

- name: Kubelet | Ensure service is active
  become: true
  ansible.builtin.systemd_service:
    name: kubelet
    state: started
    enabled: true
  tags: kubelet

# -----------------------------------------------------------------------------
# Kubectl
# -----------------------------------------------------------------------------
# Put cluster credentials in the operator's existing account instead of assuming
# a site-specific admin user exists on freshly provisioned hosts.
# -----------------------------------------------------------------------------

- name: Kubectl | Ensure kubeconfig directory exists
  become: true
  ansible.builtin.file:
    path: "{{ kubernetes__kubeconfig_home }}/.kube"
    state: directory
    owner: "{{ kubernetes__kubeconfig_user }}"
    group: "{{ kubernetes__kubeconfig_group }}"
    mode: "0755"
  tags: kubectl

- name: Kubectl | Install kubeconfig for operator user
  become: true
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubernetes__kubeconfig_home }}/.kube/config"
    remote_src: true
    owner: "{{ kubernetes__kubeconfig_user }}"
    group: "{{ kubernetes__kubeconfig_group }}"
    mode: "0600"
  tags: kubectl

# -----------------------------------------------------------------------------
# Single-node scheduling
# -----------------------------------------------------------------------------
# A one-node cluster has no workers, so ordinary workloads must be allowed onto
# the control-plane node after kubeadm applies its protective taint.
# -----------------------------------------------------------------------------

- name: Single-node scheduling | Allow pods on control-plane
  become: true
  ansible.builtin.command:
    cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes --all node-role.kubernetes.io/control-plane-
  register: kubernetes__untaint
  changed_when: "'untainted' in kubernetes__untaint.stdout"
  failed_when:
    - kubernetes__untaint.rc != 0
    - "'not found' not in kubernetes__untaint.stderr"
  tags: scheduling

# -----------------------------------------------------------------------------
# CNI
# -----------------------------------------------------------------------------
# Flannel is simple enough for the single-node target and its upstream manifest
# matches the role's default pod subnet. Flannel does not enforce NetworkPolicy.
# -----------------------------------------------------------------------------

- name: CNI | Check Flannel installation
  become: true
  ansible.builtin.command:
    cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf get daemonset kube-flannel-ds -n kube-flannel
  register: kubernetes__flannel
  failed_when: false
  changed_when: false
  tags: cni

- name: CNI | Install Flannel
  become: true
  ansible.builtin.command:
    cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f {{ kubernetes_flannel_manifest_url }}
  changed_when: true
  when: kubernetes__flannel.rc != 0
  tags: cni

# -----------------------------------------------------------------------------
# Metrics server
# -----------------------------------------------------------------------------
# Single-node kubeadm clusters use self-signed kubelet serving certificates; the
# metrics server is patched for that private-node trade-off so kubectl top works.
# -----------------------------------------------------------------------------

- name: Metrics server | Read deployed version
  become: true
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf
      get deployment metrics-server -n kube-system
      -o jsonpath={.spec.template.spec.containers[0].image}
  register: kubernetes__metrics_server_image
  failed_when: false
  changed_when: false
  tags: metrics_server

- name: Metrics server | Install
  become: true
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf
      apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ kubernetes_metrics_server_version }}/components.yaml
  changed_when: true
  when: >-
    kubernetes__metrics_server_image.rc != 0
    or (kubernetes__metrics_server_image.stdout.split(':') | last) != kubernetes_metrics_server_version
  tags: metrics_server

- name: Metrics server | Read container arguments
  become: true
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf get deployment metrics-server
      -n kube-system -o jsonpath='{.spec.template.spec.containers[0].args}'
  register: kubernetes__metrics_server_args
  changed_when: false
  tags: metrics_server

- name: Metrics server | Allow self-signed kubelet serving certificates
  become: true
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf patch deployment metrics-server
      -n kube-system
      --type=json
