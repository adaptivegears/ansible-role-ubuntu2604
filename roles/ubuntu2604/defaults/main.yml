---
# Mandatory on the first run; subsequent runs reuse the saved hostname.
ubuntu2604_hostname: "{{ ubuntu2604__facts.get('hostname', '') }}"

# Explicit inventory/playbook/CLI values override these saved-value fallbacks.
ubuntu2604_disable_ipv6: "{{ ubuntu2604__facts.get('disable_ipv6', true) }}"
ubuntu2604_locale: "{{ ubuntu2604__facts.get('locale', 'en_US.UTF-8') }}"
ubuntu2604_timezone: "{{ ubuntu2604__facts.get('timezone', 'UTC') }}"
# Applies only to non-root provisioning; root runs always retain root SSH access.
ubuntu2604_ssh_allow_root_login: "{{ ubuntu2604__facts.get('ssh_allow_root_login', false) }}"
ubuntu2604_ssh_allow_tcp_forwarding: "{{ ubuntu2604__facts.get('ssh_allow_tcp_forwarding', false) }}"
ubuntu2604_ssh_port: "{{ ubuntu2604__facts.get('ssh_port', 22) }}"
