---
# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------
# Public defaults resolve saved settings through normal Ansible precedence.
# Validate everything before saving the desired state, so failed application can
# be retried without repeating inputs and new role defaults cannot reset a host.
# -----------------------------------------------------------------------------

- name: Configuration | Validate and save desired settings
  tags: always
  block:
    - name: Configuration | Validate required hostname
      ansible.builtin.assert:
        that:
          - ubuntu2604_hostname is string
          - ubuntu2604_hostname | length <= 64
          - >-
            ubuntu2604_hostname.split('.')
            | reject('match', '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
            | list | length == 0
        fail_msg: >-
          Set ubuntu2604_hostname on the first run. It must be a lowercase DNS
          hostname or FQDN, at most 64 characters. Later runs reuse the saved name.

    - name: Configuration | Validate string settings
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', item) is string
          - lookup('ansible.builtin.vars', item) | trim | length > 0
        fail_msg: "{{ item }} must be a non-empty string."
      loop:
        - ubuntu2604_locale
        - ubuntu2604_timezone

    - name: Configuration | Validate boolean settings
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', item) | string | lower in ['true', 'false', 'yes', 'no', 'on', 'off', '1', '0']
        fail_msg: "{{ item }} must be a boolean or a recognized boolean value."
      loop:
        - ubuntu2604_disable_ipv6
        - ubuntu2604_ssh_allow_root_login
        - ubuntu2604_ssh_allow_tcp_forwarding

    - name: Configuration | Validate SSH port
      ansible.builtin.assert:
        that:
          - >-
            ubuntu2604_ssh_port is integer
            or (ubuntu2604_ssh_port is string and ubuntu2604_ssh_port is match('^[0-9]+$'))
          - ubuntu2604_ssh_port | int >= 1
          - ubuntu2604_ssh_port | int <= 65535
        fail_msg: "ubuntu2604_ssh_port must be an integer from 1 to 65535."

    - name: Configuration | Prepare complete settings snapshot
      ansible.builtin.set_fact:
        ubuntu2604__vars: >-
          {{ ubuntu2604__facts | combine({
            'hostname': ubuntu2604_hostname,
            'disable_ipv6': ubuntu2604_disable_ipv6 | bool,
            'locale': ubuntu2604_locale,
            'timezone': ubuntu2604_timezone,
            'ssh_allow_root_login': ubuntu2604_ssh_allow_root_login | bool,
            'ssh_allow_tcp_forwarding': ubuntu2604_ssh_allow_tcp_forwarding | bool,
            'ssh_port': ubuntu2604_ssh_port | int
          }) }}

    - name: Configuration | Ensure local facts directory exists
      become: true
      ansible.builtin.file:
        path: /etc/ansible/facts.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configuration | Save complete desired settings
      become: true
      ansible.builtin.copy:
        dest: /etc/ansible/facts.d/ubuntu2604.fact
        content: "{{ ubuntu2604__vars | to_nice_json }}\n"
        owner: root
        group: root
        mode: "0644"
      register: ubuntu2604__facts_file

    - name: Configuration | Refresh local facts
      ansible.builtin.setup:
        filter: ansible_local
      when:
        - ubuntu2604__facts_file is changed
        - not ansible_check_mode
