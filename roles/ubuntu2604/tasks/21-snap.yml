---
# -----------------------------------------------------------------------------
# Snap
# -----------------------------------------------------------------------------
# Fresh container-worker nodes do not retain snap workloads or their data.
# Remove installed snaps before their package manager, without creating snapshots.
# -----------------------------------------------------------------------------

- name: Snap | Check for snap command
  become: true
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: ubuntu2604__snap_command
  tags: [snap, apt, packages]

- name: Snap | Read installed snap packages
  become: true
  ansible.builtin.command: timeout 30 snap list --all
  register: ubuntu2604__snap_list
  changed_when: false
  when: ubuntu2604__snap_command.stat.exists
  tags: [snap, apt, packages]

- name: Snap | Record installed snap package names
  ansible.builtin.set_fact:
    ubuntu2604__installed_snap_names: >-
      {{
        ubuntu2604__snap_list.stdout_lines | default([])
        | reject('match', '^No snaps are installed')
        | map('split')
        | select
        | map('first')
        | reject('equalto', 'Name')
        | unique
        | list
      }}
  tags: [snap, apt, packages]

# Bulk removal lets snapd order applications before their base/content providers.
# The snapd snap must be removed separately: it refuses removal while others exist.
- name: Snap | Purge installed snap applications and dependencies
  become: true
  ansible.builtin.command:
    argv: >-
      {{
        ['snap', 'remove', '--purge']
        + (ubuntu2604__installed_snap_names | reject('equalto', 'snapd') | list)
      }}
  changed_when: true
  when: ubuntu2604__installed_snap_names | reject('equalto', 'snapd') | list | length > 0
  tags: [snap, apt, packages]

- name: Snap | Purge installed snapd snap
  become: true
  ansible.builtin.command:
    argv:
      - snap
      - remove
      - --purge
      - snapd
  changed_when: true
  when: "'snapd' in ubuntu2604__installed_snap_names"
  tags: [snap, apt, packages]

- name: Snap | Stop snapd services before removal
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  failed_when: false
  when: ubuntu2604__snap_command.stat.exists
  tags: [snap, apt, packages]
  loop:
    - snapd.service
    - snapd.socket
    - snapd.seeded.service

- name: Snap | Remove snapd package
  become: true
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true
    autoremove: true
    lock_timeout: 600
  tags: [snap, apt, packages]

- name: Snap | Block snapd reinstallation
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-ubuntu2604-nosnap.pref
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/andreygubarev/ansible-collection

      # Keep server images free of snapd unless an operator deliberately removes this policy.
      Package: snapd
      Pin: release *
      Pin-Priority: -1
    owner: root
    group: root
    mode: "0644"
  tags: [snap, apt, packages]

- name: Snap | Remove residual system snap directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  tags: [snap, apt, packages]
  loop:
    - /snap
    - /var/cache/snapd
    - /var/lib/snapd
    - /var/snap

- name: Snap | Reload systemd after snapd removal
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false
  tags: [snap, apt, packages]
