---
# -----------------------------------------------------------------------------
# Package cleanup
# -----------------------------------------------------------------------------
# Limit cleanup to explicit packages, preserving the base metapackage, Ubuntu Pro,
# storage/network integration, and administrative tools supplied by cloud images.
# -----------------------------------------------------------------------------

- name: APT | Remove container-worker irrelevant packages
  become: true
  ansible.builtin.apt:
    name:
      # Cellular modem support probes physical hardware absent from container-worker VMs.
      - modemmanager
      # Firmware, removable-disk, and Thunderbolt daemons are for physical or
      # desktop-style hosts; on container-worker VMs they add idle services and deps.
      - fwupd
      - udisks2
      - bolt
      # Crash-reporting packages are for interactive Ubuntu bug reporting, not
      # production VM recovery where logs and core policies are managed separately.
      - apport
      - apport-core-dump-handler
      # Cloud images seed entropy at boot; this external entropy helper is not
      # needed by the container-worker baseline.
      - pollinate
      # Interactive release upgrades and update notifications are outside the
      # role's APT-based package and security update management.
      - update-manager-core
      - update-notifier-common
    state: absent
    purge: true
    lock_timeout: 600
  tags: [apt, packages]
