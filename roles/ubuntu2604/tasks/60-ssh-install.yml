---
# -----------------------------------------------------------------------------
# SSH
# -----------------------------------------------------------------------------
# Put recovery-path hardening in a 00-* drop-in so it precedes cloud-init/package
# snippets without rewriting sshd_config.
# -----------------------------------------------------------------------------

- name: SSH | Install OpenSSH server
  become: true
  ansible.builtin.apt:
    name: openssh-server
    state: present
    install_recommends: false
  tags: [ssh, packages]

- name: SSH | Ensure sshd runtime directory exists
  become: true
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ssh

- name: SSH | Ensure sshd drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ssh
