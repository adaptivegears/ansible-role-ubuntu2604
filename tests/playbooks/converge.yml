---
- name: Apply Ubuntu to the test VM
  hosts: incus_test
  become: true
  roles:
    - andreygubarev.com.ubuntu2604

- name: Apply Kubernetes after Ubuntu
  hosts: incus_test
  become: true
  roles:
    - andreygubarev.com.kubernetes

- name: Apply Terraform tooling for the test user
  hosts: incus_test
  roles:
    - andreygubarev.com.terraform

- name: Install the Pi harness
  hosts: incus_test
  vars:
    # Exercise temporary-file ACL sharing when becoming the unprivileged bb user.
    ansible_pipelining: false
  roles:
    - andreygubarev.com.agents

- name: Wait for the cluster
  ansible.builtin.import_playbook: ready.yml
