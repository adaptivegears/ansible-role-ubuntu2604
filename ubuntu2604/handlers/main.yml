---
- name: Reexec systemd manager
  become: true
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Restart systemd-journald
  become: true
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Restart systemd-resolved
  become: true
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted

# Restart the socket before the service: sshd is socket-activated on Ubuntu
# 26.04, so listener changes (such as a port move) only apply after a
# daemon-reload reruns sshd-socket-generator and ssh.socket rebinds.
- name: Restart OpenSSH
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - ssh.socket
    - ssh.service
