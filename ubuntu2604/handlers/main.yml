---
- name: Reexec systemd manager
  become: true
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Restart systemd-journald
  become: true
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Restart systemd-resolved
  become: true
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted

- name: Restart OpenSSH
  become: true
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
