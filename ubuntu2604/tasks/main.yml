---
# -----------------------------------------------------------------------------
# Prerequisite
# -----------------------------------------------------------------------------
# Settle boot-time initialization and fail before mutation so unsupported images
# do not get partial policy.
# -----------------------------------------------------------------------------

- name: Prerequisite | Assert OS is Ubuntu 26.04
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_version'] == "26.04"
    fail_msg: >-
      This role requires Ubuntu 26.04
      (detected {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})
    success_msg: "OS check passed: Ubuntu 26.04"
  tags: always

- name: Prerequisite | Assert architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ["x86_64", "aarch64"]
    fail_msg: >-
      This role requires amd64 or arm64 architecture
      (detected {{ ansible_facts['architecture'] }})
    success_msg: "Architecture check passed: {{ ansible_facts['architecture'] }}"
  tags: always

- name: Prerequisite | Read SSH user
  ansible.builtin.set_fact:
    ubuntu2604__ssh_user: >-
      {{ ansible_user | default(ansible_ssh_user) }}
  tags: ssh

- name: Prerequisite | Assert SSH hardening for root user
  ansible.builtin.assert:
    that:
      - ubuntu2604__ssh_user != "root" or ubuntu2604_ssh_allow_root_login | bool
    fail_msg: >-
      Refusing to disable root SSH while Ansible is connected as root. Connect as
      a non-root sudo user with SSH keys, or explicitly set
      ubuntu2604_ssh_allow_root_login=true after accepting that root key-based
      SSH remains part of the recovery path.
    success_msg: "SSH root access guardrail passed"
  tags: ssh

- name: Prerequisite | Read SSH user account
  ansible.builtin.getent:
    database: passwd
    key: "{{ ubuntu2604__ssh_user }}"
  tags: ssh

- name: Prerequisite | Read SSH user authorized keys
  ansible.builtin.stat:
    path: "{{ ansible_facts.getent_passwd[ubuntu2604__ssh_user][4] }}/.ssh/authorized_keys"
  register: ubuntu2604__ssh_authorized_keys
  tags: ssh

- name: Prerequisite | Assert SSH hardening for password authentication
  ansible.builtin.assert:
    that:
      - ubuntu2604__ssh_authorized_keys.stat.exists
      - ubuntu2604__ssh_authorized_keys.stat.size | int > 0
    fail_msg: >-
      Refusing to disable SSH password authentication because the current Ansible
      login user '{{ ubuntu2604__ssh_user }}' has no authorized_keys file.
      Provision SSH keys for this user, connect as a keyed sudo user, or import
      operator keys before applying this role.
    success_msg: "SSH key access guardrail passed"
  tags: ssh

- name: Prerequisite | Get cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: ubuntu2604__cloud_init
  tags: always

- name: Prerequisite | Wait for cloud-init to finish
  ansible.builtin.command:
    argv:
      - timeout
      - "1800"
      - /usr/bin/cloud-init
      - status
      - --wait
  register: ubuntu2604__cloud_init_timeout
  # This is a sequencing barrier, not cloud-init validation; rc=1 can mean cloud-init is done but recorded errors.
  failed_when: ubuntu2604__cloud_init_timeout.rc not in [0, 1, 2]
  changed_when: false
  when: ubuntu2604__cloud_init.stat.exists
  tags: always

- name: Prerequisite | Report cloud-init completed with errors
  ansible.builtin.debug:
    msg: >-
      cloud-init completed with errors before this role started. Continuing
      because boot-time cloud-init APT work is no longer running; inspect
      'cloud-init status --long' and /var/log/cloud-init.log for root cause.
  when:
    - ubuntu2604__cloud_init.stat.exists
    - ubuntu2604__cloud_init_timeout.rc == 1
  tags: always

# -----------------------------------------------------------------------------
# Kernel
# -----------------------------------------------------------------------------
# Container-worker VMs need routing, density, observability, and auto-recovery
# defaults instead of general-purpose Ubuntu conservatism.
# -----------------------------------------------------------------------------

- name: Kernel | Persist container kernel modules
  become: true
  ansible.builtin.copy:
    dest: /etc/modules-load.d/99-ubuntu2604-container.conf
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      # Load bridge netfilter early so bridge sysctls exist on minimal images.
      br_netfilter
      # Load conntrack before runtimes so NAT sizing takes effect.
      nf_conntrack
      # Require OverlayFS explicitly for overlay snapshotters.
      overlay
    owner: root
    group: root
    mode: "0644"
  tags: [kernel, network]

- name: Kernel | Load container kernel modules
  become: true
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  tags: [kernel, network]
  loop:
    - br_netfilter
    - nf_conntrack
    - overlay

- name: Kernel | Configure sysctls
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-ubuntu2604.conf
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      # Route bridged container traffic through host firewall policy.
      net.bridge.bridge-nf-call-arptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1

      # Size the host FD pool so dense containers do not exhaust descriptors.
      fs.file-max = 2097152
      # Raise inotify for source-tree watchers and reload bursts.
      fs.inotify.max_queued_events = 32768
      fs.inotify.max_user_instances = 512
      fs.inotify.max_user_watches = 524288
      # Let PAM/systemd FD raises reach the host descriptor ceiling.
      fs.nr_open = 2097152

      # Reboot 10s after panic so cattle VMs recover without console access.
      kernel.panic = 10
      # Panic on kernel faults rather than keep unreliable network/storage state.
      kernel.panic_on_oops = 1
      # Raise global PID space so cgroups, not host PID max, bound dense workers.
      kernel.pid_max = 4194304
      # Account per-task delay so noisy containers can be diagnosed.
      kernel.task_delayacct = 1

      # Buffer veth ingress bursts instead of dropping before sockets drain.
      net.core.netdev_max_backlog = 65536
      # Deepen accept queues for deploy/restart spikes across colocated services.
      net.core.somaxconn = 65536

      # Let container bridges route IPv4 even when the VM is otherwise not a router.
      net.ipv4.ip_forward = 1
      # Widen ephemeral ports so NATed containers do not exhaust outbound source ports.
      net.ipv4.ip_local_port_range = 1024 65535
      # Let rootless services bind 80/443 without CAP_NET_BIND_SERVICE.
      net.ipv4.ip_unprivileged_port_start = 0
      # Raise neighbor cache for bridge scale-up without ARP eviction.
      net.ipv4.neigh.default.gc_thresh1 = 2048
      net.ipv4.neigh.default.gc_thresh2 = 4096
      net.ipv4.neigh.default.gc_thresh3 = 8192
      # Expire FIN-WAIT-2 faster so churn does not pin dead connections.
      net.ipv4.tcp_fin_timeout = 15
      # Detect dead long-lived TCP peers within minutes so stale sockets release quickly.
      net.ipv4.tcp_keepalive_intvl = 30
      net.ipv4.tcp_keepalive_probes = 5
      net.ipv4.tcp_keepalive_time = 600
      # Deepen SYN queues so short bursts do not fail proxies/edge services.
      net.ipv4.tcp_max_syn_backlog = 65536
      # Enable SYN cookies on backlog overflow so internet-facing services resist SYN floods.
      net.ipv4.tcp_syncookies = 1
      # Reuse safe TIME-WAIT sockets so high-outbound workloads avoid ephemeral-port starvation.
      net.ipv4.tcp_tw_reuse = 1

      {% if ubuntu2604_disable_ipv6 | bool %}
      # Disable IPv6 when the environment is intentionally IPv4-only.
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 1
      {% else %}
      # Keep IPv6 available while routing it for present and future bridges.
      net.ipv6.conf.all.disable_ipv6 = 0
      net.ipv6.conf.default.disable_ipv6 = 0
      net.ipv6.conf.lo.disable_ipv6 = 0
      net.ipv6.conf.all.accept_ra = 2
      net.ipv6.conf.all.forwarding = 1
      net.ipv6.conf.default.accept_ra = 2
      net.ipv6.conf.default.forwarding = 1
      {% endif %}

      # Hold more NAT flows so high-fan-out egress does not drop new connections.
      net.netfilter.nf_conntrack_max = 1048576

      # Allow rootless containers/build sandboxes without privileged runtime mode.
      user.max_user_namespaces = 15000

      # Allow mmap-heavy services such as Elasticsearch, databases, and JVMs to run
      # in containers without hitting host VMA ceilings.
      vm.max_map_count = 262144
      # Reserve free memory to avoid reclaim deadlocks under pressure.
      vm.min_free_kbytes = 131072
      # Use optimistic reservations because cgroups/OOM policy handle real pressure.
      vm.overcommit_memory = 1
      # Do not panic the VM on OOM; let cgroup and userspace OOM handling run first.
      vm.panic_on_oom = 0
      # Prefer keeping application pages in RAM instead of swapping active container memory.
      vm.swappiness = 10
    owner: root
    group: root
    mode: "0644"
  tags: [kernel, network]

- name: Kernel | Apply sysctls
  become: true
  ansible.builtin.command: sysctl --load /etc/sysctl.d/99-ubuntu2604.conf
  changed_when: false
  tags: [kernel, network]

- name: Kernel | Configure PAM limits
  become: true
  ansible.builtin.copy:
    dest: /etc/security/limits.d/60-ubuntu2604-container.conf
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      # Keep PAM-launched sessions from retaining low descriptor defaults after
      # raising kernel FD ceilings.
      * soft nofile 65536
      * hard nofile 65536
      # Keep login shells and user services from hitting per-session limits before
      # host PID capacity.
      * soft nproc 65536
      * hard nproc 65536
    owner: root
    group: root
    mode: "0644"
  tags: kernel

# Keep THP opt-in: runtimes can request it, while databases and low-latency
# services avoid surprise compaction. Use a one-shot because THP is sysfs-only.
- name: Kernel | Create transparent hugepages policy service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/transparent-hugepages-madvise.service
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      [Unit]
      Description=Set Transparent Hugepages to madvise
      Documentation=https://github.com/adaptivegears/ansible-role-ubuntu2604
      After=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo madvise | tee /sys/kernel/mm/transparent_hugepage/enabled'
      # Stay active so Ansible sees the sysfs policy as converged.
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  tags: kernel
  register: ubuntu2604__thp_service

- name: Kernel | Start transparent hugepages policy service
  become: true
  ansible.builtin.systemd_service:
    name: transparent-hugepages-madvise
    enabled: true
    # Reload units only when the generated policy changes.
    daemon_reload: "{{ ubuntu2604__thp_service.changed }}"
    state: started
  tags: kernel

# -----------------------------------------------------------------------------
# Systemd
# -----------------------------------------------------------------------------
# PAM misses system-manager services; manager defaults give runtimes density
# headroom while cgroup accounting stays useful for noisy-container diagnosis.
# -----------------------------------------------------------------------------

- name: Systemd | Ensure system manager drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: systemd

- name: Systemd | Configure container density defaults
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/60-ubuntu2604-density.conf
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      [Manager]
      # Keep service-launched workloads aligned with the kernel and PAM file
      # descriptor ceilings instead of inheriting low package defaults.
      DefaultLimitNOFILE=65536
      # Give service process trees the same headroom as login sessions so dense
      # workers hit explicit cgroup policy before systemd's manager default.
      DefaultLimitNPROC=65536
      DefaultTasksMax=65536

      # CPU usage is always accounted on Ubuntu 26.04's unified cgroup stack;
      # keep memory and task accounting explicit so runtime-agnostic host tools
      # can attribute pressure to service units.
      DefaultMemoryAccounting=yes
      DefaultTasksAccounting=yes
    mode: "0644"
  tags: systemd
  notify: Reexec systemd manager

# Re-exec before runtimes start so same-play services inherit new defaults.
- name: Systemd | Apply manager default changes
  ansible.builtin.meta: flush_handlers
  tags: systemd

# -----------------------------------------------------------------------------
# Swap
# -----------------------------------------------------------------------------
# Disable swap because host paging undermines container latency and OOM policy.
# -----------------------------------------------------------------------------

- name: Swap | Disable active swap
  become: true
  ansible.builtin.command: swapoff -a
  changed_when: false
  tags: swap

- name: Swap | Remove swap entries from fstab
  become: true
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\sswap\s.*)$'
    replace: '# Disabled by ansible-role-ubuntu2604 (https://github.com/adaptivegears/ansible-role-ubuntu2604): \1'
    backup: true
  tags: swap

# -----------------------------------------------------------------------------
# APT
# -----------------------------------------------------------------------------
# Own Canonical archive sources after cloud-init for deterministic APT without
# cloud-provider probing. Ubuntu 26.04 serves arm64 from normal archive/security
# endpoints, so amd64 and arm64 hosts share the same provider-neutral sources.
# -----------------------------------------------------------------------------

- name: APT | Remove legacy mirror list files
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  tags: apt
  loop:
    - /etc/apt/ubuntu-mirrors.txt
    - /etc/apt/ubuntu-security-mirrors.txt

- name: APT | Configure Ubuntu archive sources
  become: true
  ansible.builtin.template:
    src: ubuntu.sources.j2
    dest: /etc/apt/sources.list.d/ubuntu.sources
    mode: "0644"
  tags: apt
  register: ubuntu2604__apt_sources

- name: APT | Update package cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    # Force refresh after source changes; otherwise reuse recent metadata to spare archives.
    cache_valid_time: "{{ 0 if ubuntu2604__apt_sources is changed else 3600 }}"
  # Cache refreshes are preconditions, not configuration drift.
  changed_when: false
  tags: apt

# -----------------------------------------------------------------------------
# Snap
# -----------------------------------------------------------------------------
# Fresh container-worker nodes do not retain snap workloads or their data.
# Remove installed snaps before their package manager, without creating snapshots.
# -----------------------------------------------------------------------------

- name: Snap | Check for snap command
  become: true
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: ubuntu2604__snap_command
  tags: [snap, apt, packages]

- name: Snap | Read installed snap packages
  become: true
  ansible.builtin.command: timeout 30 snap list --all
  register: ubuntu2604__snap_list
  changed_when: false
  when: ubuntu2604__snap_command.stat.exists
  tags: [snap, apt, packages]

- name: Snap | Record installed snap package names
  ansible.builtin.set_fact:
    ubuntu2604__installed_snap_names: >-
      {{
        ubuntu2604__snap_list.stdout_lines | default([])
        | reject('match', '^No snaps are installed')
        | map('split')
        | select
        | map('first')
        | reject('equalto', 'Name')
        | unique
        | list
      }}
  tags: [snap, apt, packages]

# Bulk removal lets snapd order applications before their base/content providers.
# The snapd snap must be removed separately: it refuses removal while others exist.
- name: Snap | Purge installed snap applications and dependencies
  become: true
  ansible.builtin.command:
    argv: >-
      {{
        ['snap', 'remove', '--purge']
        + (ubuntu2604__installed_snap_names | reject('equalto', 'snapd') | list)
      }}
  changed_when: true
  when: ubuntu2604__installed_snap_names | reject('equalto', 'snapd') | list | length > 0
  tags: [snap, apt, packages]

- name: Snap | Purge installed snapd snap
  become: true
  ansible.builtin.command:
    argv:
      - snap
      - remove
      - --purge
      - snapd
  changed_when: true
  when: "'snapd' in ubuntu2604__installed_snap_names"
  tags: [snap, apt, packages]

- name: Snap | Stop snapd services before removal
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  failed_when: false
  when: ubuntu2604__snap_command.stat.exists
  tags: [snap, apt, packages]
  loop:
    - snapd.service
    - snapd.socket
    - snapd.seeded.service

- name: Snap | Remove snapd package
  become: true
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true
    autoremove: true
    lock_timeout: 600
  tags: [snap, apt, packages]

- name: Snap | Block snapd reinstallation
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-ubuntu2604-nosnap.pref
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      # Keep server images free of snapd unless an operator deliberately removes this policy.
      Package: snapd
      Pin: release *
      Pin-Priority: -1
    owner: root
    group: root
    mode: "0644"
  tags: [snap, apt, packages]

- name: Snap | Remove residual system snap directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  tags: [snap, apt, packages]
  loop:
    - /snap
    - /var/cache/snapd
    - /var/lib/snapd
    - /var/snap

- name: Snap | Reload systemd after snapd removal
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false
  tags: [snap, apt, packages]

- name: APT | Remove container-worker irrelevant packages
  become: true
  ansible.builtin.apt:
    name:
      # Cellular modem support probes physical hardware absent from container-worker VMs.
      - modemmanager
      # Firmware, removable-disk, and Thunderbolt daemons are for physical or
      # desktop-style hosts; on container-worker VMs they add idle services and deps.
      - fwupd
      - udisks2
      - bolt
      # Multipath and iSCSI belong to broad SAN-capable server images, not the
      # local virtual disks expected by this role.
      - multipath-tools
      - open-iscsi
      # GUI/package-management authorization helpers keep PackageKit and polkit
      # daemons alive; repositories and packages are managed directly by Ansible.
      - software-properties-common
      - packagekit
      - polkitd
      # Crash-reporting packages are for interactive Ubuntu bug reporting, not
      # production VM recovery where logs and core policies are managed separately.
      - apport
      - apport-core-dump-handler
      # One-shot entropy and network event hook helpers have no steady-state role
      # here, so keeping their enabled units only adds boot/runtime noise.
      - pollinate
      - networkd-dispatcher
      # Ubuntu Pro and desktop-style update notification plumbing are not used by
      # this self-managed container-worker baseline.
      - ubuntu-pro-client
      - ubuntu-pro-client-l10n
      - update-manager-core
      - update-notifier-common
      - ubuntu-minimal
      # The role favors on-demand incident tools over periodic sar collection.
      - sysstat
    state: absent
    purge: true
    lock_timeout: 600
  tags: [apt, packages]

- name: APT | Upgrade packages and clean unused package data
  become: true
  ansible.builtin.apt:
    # Wait out cloud-init/unattended APT startup work instead of failing on dpkg locks.
    lock_timeout: 600
    # Use safe upgrades to keep rebuilt VMs current without removals.
    upgrade: safe
    # Remove orphans so old image/provisioning packages stop consuming disk.
    autoremove: true
    # Drop obsolete downloads while preserving cache entries useful later.
    autoclean: true
  tags: [apt, upgrade, packages]

- name: APT | Check reboot requirement marker
  become: true
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: ubuntu2604__reboot_required
  tags: [apt, upgrade, packages]

- name: APT | Read reboot requirement packages
  become: true
  ansible.builtin.command: cat /var/run/reboot-required.pkgs
  register: ubuntu2604__reboot_required_packages
  failed_when: false
  changed_when: false
  when: ubuntu2604__reboot_required.stat.exists
  tags: [apt, upgrade, packages]

- name: APT | Report reboot requirement
  ansible.builtin.debug:
    msg:
      - Host reboot is required after package upgrades.
      - >-
        Packages: {{ ubuntu2604__reboot_required_packages.stdout_lines | default([]) | join(', ') }}
  when: ubuntu2604__reboot_required.stat.exists
  tags: [apt, upgrade, packages]

# -----------------------------------------------------------------------------
# Unattended upgrades
# -----------------------------------------------------------------------------
# Image pipelines may strip security timers; restore them but keep reboots/restarts
# inside maintenance windows.
# -----------------------------------------------------------------------------

- name: Unattended upgrades | Install unattended upgrades package
  become: true
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  tags: [unattended_upgrades, packages]

- name: Unattended upgrades | Enable periodic security upgrades
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by ansible-role-ubuntu2604
      // Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"
  tags: unattended_upgrades

- name: Unattended upgrades | Disable unattended reboot behavior
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52ubuntu2604-unattended-upgrades
    content: |
      // Managed by ansible-role-ubuntu2604
      // Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      // Reserve reboots/shutdown installs for maintenance automation, not background APT.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
      Unattended-Upgrade::InstallOnShutdown "false";
    mode: "0644"
  tags: unattended_upgrades

- name: Unattended upgrades | Create needrestart override directory
  become: true
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    mode: "0755"
  tags: unattended_upgrades

- name: Unattended upgrades | Disable needrestart automatic service restarts
  become: true
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/99-ubuntu2604-no-auto-restarts.conf
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      # List stale processes without restarting runtimes or workload services.
      $nrconf{restart} = 'l';
    mode: "0644"
  tags: unattended_upgrades

- name: Unattended upgrades | Enable and start APT maintenance timers
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  tags: unattended_upgrades
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# -----------------------------------------------------------------------------
# Logs
# -----------------------------------------------------------------------------
# Container hosts burst logs; keep reboot history but cap journals/free space so
# logs cannot crowd out packages or workload state.
# -----------------------------------------------------------------------------

- name: Logs | Ensure journald drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: logs

- name: Logs | Ensure persistent journal directory exists
  become: true
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  tags: logs

- name: Logs | Configure journald retention and pressure limits
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-ubuntu2604-log-pressure.conf
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      [Journal]
      # Keep recovery history without unbounded journal growth on small disks.
      Storage=persistent
      Compress=yes
      SystemMaxUse=1G
      SystemMaxFileSize=128M
      MaxRetentionSec=30day
      MaxFileSec=1week

      # Reserve /var/log and /run space so log storms age out instead of filling the VM.
      SystemKeepFree=2G
      RuntimeMaxUse=256M
      RuntimeKeepFree=512M
    mode: "0644"
  tags: logs
  notify: Restart systemd-journald

- name: Logs | Apply journal retention to existing files
  become: true
  ansible.builtin.command: journalctl --vacuum-size=1G --vacuum-time=30d
  changed_when: false
  tags: logs

# -----------------------------------------------------------------------------
# Firewall
# -----------------------------------------------------------------------------
# Use nftables as the sole host firewall manager; ruleset ownership belongs to
# hardening or site policy.
# -----------------------------------------------------------------------------

- name: Firewall | Install netfilter tools
  become: true
  ansible.builtin.apt:
    name:
      - conntrack
      - iptables
      - nftables
    state: present
    install_recommends: false
  tags: [firewall, packages]

- name: Firewall | Use nftables-backed compatibility commands
  become: true
  community.general.alternatives:
    name: "{{ item.name }}"
    path: "{{ item.path }}"
  tags: firewall
  loop:
    - name: iptables
      path: /usr/sbin/iptables-nft
    - name: ip6tables
      path: /usr/sbin/ip6tables-nft
    - name: arptables
      path: /usr/sbin/arptables-nft
    - name: ebtables
      path: /usr/sbin/ebtables-nft
  loop_control:
    label: "{{ item.name }}"

- name: Firewall | Enable nftables service
  become: true
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
  tags: firewall

- name: Firewall | Stop and disable UFW service
  become: true
  ansible.builtin.systemd_service:
    name: ufw
    state: stopped
    enabled: false
  tags: firewall

- name: Firewall | Mask UFW service
  become: true
  ansible.builtin.systemd_service:
    name: ufw
    masked: true
  tags: firewall

# -----------------------------------------------------------------------------
# Packages
# -----------------------------------------------------------------------------
# Install a small day-two toolbox so incident response does not start with
# package changes.
# -----------------------------------------------------------------------------

- name: Packages | Install operational tools
  become: true
  ansible.builtin.apt:
    name:
      - bind9-dnsutils
      - curl
      - exip
      - htop
      - iotop
      - jq
      - less
      - lsof
      - tcpdump
      - tmux
      - traceroute
      - tree
      - unzip
      - wget
    state: present
    install_recommends: false
  tags: packages

# -----------------------------------------------------------------------------
# SSH
# -----------------------------------------------------------------------------
# Put recovery-path hardening in a 00-* drop-in so it precedes cloud-init/package
# snippets without rewriting sshd_config.
# -----------------------------------------------------------------------------

- name: SSH | Install OpenSSH server
  become: true
  ansible.builtin.apt:
    name: openssh-server
    state: present
    install_recommends: false
  tags: [ssh, packages]

- name: SSH | Ensure sshd runtime directory exists
  become: true
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ssh

- name: SSH | Ensure sshd drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ssh

# The role-owned drop-in is the first-run marker: only replace image-provided
# host identities before this role has configured SSH for the first time.
- name: SSH | Hardening | Check for existing role configuration
  become: true
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/00-ubuntu2604-hardening.conf
  register: ubuntu2604__ssh_hardening_config
  tags: ssh

- name: SSH | Hardening | Regenerate host keys before first configuration
  become: true
  when: not ubuntu2604__ssh_hardening_config.stat.exists
  tags: ssh
  block:
    - name: SSH | Hardening | Find initial host key files
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: "ssh_host_*"
        file_type: any
      register: ubuntu2604__ssh_initial_host_keys

    - name: SSH | Hardening | Remove initial host key files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ ubuntu2604__ssh_initial_host_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: SSH | Hardening | Generate Ed25519 host key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -f
          - /etc/ssh/ssh_host_ed25519_key
          - -N
          - ""
        creates: /etc/ssh/ssh_host_ed25519_key

    - name: SSH | Hardening | Generate RSA 4096 host key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - rsa
          - -b
          - "4096"
          - -f
          - /etc/ssh/ssh_host_rsa_key
          - -N
          - ""
        creates: /etc/ssh/ssh_host_rsa_key

- name: SSH | Hardening | Configure sshd_config permissions
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
  tags: ssh

- name: SSH | Hardening | Find private host key files
  become: true
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: "ssh_host_*_key"
    excludes: "*.pub"
  tags: ssh
  register: ubuntu2604__ssh_private_key_files

- name: SSH | Hardening | Configure private host key permissions
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  tags: ssh
  loop: "{{ ubuntu2604__ssh_private_key_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: SSH | Hardening | Find public host key files
  become: true
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: "ssh_host_*.pub"
  tags: ssh
  register: ubuntu2604__ssh_public_key_files

- name: SSH | Hardening | Configure public host key permissions
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0644"
  tags: ssh
  loop: "{{ ubuntu2604__ssh_public_key_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: SSH | Hardening | Configure priority drop-in
  become: true
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ubuntu2604-hardening.conf
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      # 00-* wins over later cloud-init/package snippets.
      # Verbose auth logs aid SSH recovery without debug noise.
      LogLevel VERBOSE

      # Listen port for the OpenSSH admin endpoint. Ubuntu 26.04 runs sshd
      # socket-activated: sshd-socket-generator derives ssh.socket ListenStream
      # entries from this directive on daemon-reload, so it stays authoritative
      # whether sshd is socket-activated or standalone.
      Port {{ ubuntu2604_ssh_port }}

      # Use keys only while preserving PAM session policy.
      LoginGraceTime 60
      MaxAuthTries 3
      PasswordAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin {{ ubuntu2604_ssh_allow_root_login | bool | ternary('yes', 'no') }}
      PubkeyAuthentication yes
      UsePAM yes

      # Disable legacy trust paths and user-controlled environment injection.
      HostbasedAuthentication no
      IgnoreRhosts yes
      PermitUserEnvironment no

      # Match ssh-audit's Ubuntu 26.04 server guide v1 (2026-06-14).
      # https://www.ssh-audit.com/hardening_guides.html
      # Require hybrid post-quantum KEX and preserve the guide's exact lists/order.
      KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-gcm@openssh.com,aes128-ctr
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
      RequiredRSASize 3072
      HostKeyAlgorithms {{
        'sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,'
        ~ 'rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,'
        ~ 'sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512,rsa-sha2-256'
      }}
      CASignatureAlgorithms sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512,rsa-sha2-256
      GSSAPIKexAlgorithms gss-curve25519-sha256-,gss-group16-sha512-
      HostbasedAcceptedAlgorithms {{
        'sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,'
        ~ 'rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,'
        ~ 'sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512,rsa-sha2-256'
      }}
      PubkeyAcceptedAlgorithms {{
        'sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,'
        ~ 'rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,'
        ~ 'sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512,rsa-sha2-256'
      }}

      # Drop clients after three unanswered five-minute probes to clear lost
      # connections; responsive clients stay connected even without user input.
      ClientAliveCountMax 3
      ClientAliveInterval 300

      # Bound concurrent sessions and unauthenticated bursts to limit abuse.
      MaxSessions 3
      MaxStartups 10:30:60

      # Avoid unaudited tunnels and desktop forwarding on workers.
      AllowTcpForwarding {{ ubuntu2604_ssh_allow_tcp_forwarding | bool | ternary('yes', 'no') }}
      Banner none
      X11Forwarding no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  tags: ssh
  notify: Restart OpenSSH

- name: SSH | Hardening | Validate sshd configuration
  become: true
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  tags: ssh

- name: SSH | Ensure OpenSSH service is active
  become: true
  ansible.builtin.systemd_service:
    name: ssh
    state: started
    enabled: true
  tags: ssh

# -----------------------------------------------------------------------------
# Locale
# -----------------------------------------------------------------------------
# Set a UTF-8 locale so minimal images do not leak C/POSIX into Unicode paths/logs.
# -----------------------------------------------------------------------------

# Minimal/cloud images may omit locales; install it before locale_gen.
- name: Locale | Install locales package
  become: true
  ansible.builtin.apt:
    name: locales
    state: present
  tags: [locale, packages]

- name: Locale | Generate system locale
  become: true
  community.general.locale_gen:
    name: "{{ ubuntu2604_locale }}"
    state: present
  tags: locale

- name: Locale | Mark default locale management
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    line: "# Managed by ansible-role-ubuntu2604"
    insertbefore: BOF
    create: true
    mode: "0644"
  tags: locale

- name: Locale | Record default locale source
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    line: "# Source: https://github.com/adaptivegears/ansible-role-ubuntu2604"
    insertafter: "^# Managed by ansible-role-ubuntu2604$"
    create: true
    mode: "0644"
  tags: locale

- name: Locale | Set default locale
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANG="
    line: "LANG={{ ubuntu2604_locale }}"
    create: true
    mode: "0644"
  tags: locale

# -----------------------------------------------------------------------------
# Time
# -----------------------------------------------------------------------------
# Use UTC for cross-region log correlation; keep Ubuntu's chrony stack.
# -----------------------------------------------------------------------------

- name: Time | Set timezone to UTC
  become: true
  community.general.timezone:
    name: "{{ ubuntu2604_timezone }}"
  tags: time

- name: Time | Ensure chrony time synchronization is active
  become: true
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true
  tags: time

# -----------------------------------------------------------------------------
# DNS
# -----------------------------------------------------------------------------
# Keep DHCP DNS primary for internal zones; FallbackDNS only covers links with
# no known servers.
# -----------------------------------------------------------------------------

- name: DNS | Ensure systemd-resolved is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: started
    enabled: true
  tags: dns

- name: DNS | Ensure /etc/resolv.conf points to the systemd stub
  become: true
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  tags: dns
  notify: Restart systemd-resolved

- name: DNS | Ensure resolved.conf.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  tags: dns

- name: DNS | Configure fallback DNS servers
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/60-ubuntu2604-fallback-dns.conf
    content: |
      # Managed by ansible-role-ubuntu2604
      # Source: https://github.com/adaptivegears/ansible-role-ubuntu2604

      [Resolve]
      FallbackDNS=1.1.1.1 1.0.0.1
    mode: "0644"
  tags: dns
  notify: Restart systemd-resolved

# -----------------------------------------------------------------------------
# MOTD
# -----------------------------------------------------------------------------
# Keep worker SSH logins quiet; disable vendor news while leaving MOTD installed.
# -----------------------------------------------------------------------------

- name: MOTD | Find dynamic MOTD entries
  become: true
  ansible.builtin.find:
    paths: /etc/update-motd.d
    file_type: any
  tags: motd
  register: ubuntu2604__motd

- name: MOTD | Remove dynamic MOTD entries
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  tags: motd
  loop: "{{ ubuntu2604__motd.files }}"
  when:
    - ubuntu2604__motd.files | length > 0
    - not item.isdir

- name: MOTD | Ensure update-motd.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/update-motd.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: motd

- name: MOTD | Clear static MOTD file
  become: true
  ansible.builtin.copy:
    content: ""
    dest: /etc/motd
    mode: "0644"
    owner: root
    group: root
  tags: motd

- name: MOTD | Disable motd-news timer
  become: true
  ansible.builtin.systemd_service:
    name: motd-news.timer
    state: stopped
    enabled: false
    masked: true
  tags: motd
