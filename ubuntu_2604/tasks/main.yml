---
# -----------------------------------------------------------------------------
# Kernel
# -----------------------------------------------------------------------------
# Ubuntu defaults are conservative for general-purpose hosts, while these VMs
# are treated as disposable container workers. The role chooses host-level
# defaults that favor routing, density, observability, and automatic recovery so
# container behavior is consistent across fresh cloud images and rebuilds.
# -----------------------------------------------------------------------------

- name: Kernel | Load container kernel modules
  become: true
  community.general.modprobe:
    name: "{{ item }}"
    persistent: present
    state: present
  tags: kernel
  loop:
    # Bridge netfilter must be loaded before bridge sysctls exist on minimal images.
    - br_netfilter
    # Preload connection tracking so NAT capacity tuning applies before runtimes start.
    - nf_conntrack
    # OverlayFS is the common writable layer for container images; load it early
    # for predictable startup.
    - overlay

- name: Kernel | Configure sysctls
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-ubuntu-2604.conf
    state: present
    reload: true
  tags: kernel
  loop:
    # Send bridged ARP packets through arptables so host bridge policy can see L2 container traffic.
    - name: net.bridge.bridge-nf-call-arptables
      value: "1"
    # Send bridged IPv6 packets through ip6tables so host policy can see container traffic.
    - name: net.bridge.bridge-nf-call-ip6tables
      value: "1"
    # Send bridged IPv4 packets through iptables so host policy can see container traffic.
    - name: net.bridge.bridge-nf-call-iptables
      value: "1"

    # Size the host-wide file-descriptor pool for dense workers so colocated
    # containers do not exhaust kernel descriptors.
    - name: fs.file-max
      value: "2097152"
    # Absorb file-watch bursts from build and reload tools so change
    # notifications are not dropped under load.
    - name: fs.inotify.max_queued_events
      value: "32768"
    # Allow agents, editors, and runtimes to maintain independent watchers under
    # the same user without competing for a tiny default.
    - name: fs.inotify.max_user_instances
      value: "512"
    # Cover large source trees and mounted volumes that reloaders and build tools
    # watch recursively.
    - name: fs.inotify.max_user_watches
      value: "524288"
    # Align the per-process descriptor ceiling with the host pool so raised PAM
    # and systemd limits can actually take effect.
    - name: fs.nr_open
      value: "2097152"

    # Reboot 10 seconds after kernel panic so cattle VMs recover without console access.
    - name: kernel.panic
      value: "10"
    # Fail fast after kernel faults because continuing can leave container
    # networking or storage in an unreliable state.
    - name: kernel.panic_on_oops
      value: "1"
    # Expand global PID space for dense process trees so host-level PID limits are
    # not reached before cgroup limits.
    - name: kernel.pid_max
      value: "4194304"
    # Track per-task CPU, I/O, and memory-delay time for diagnosing noisy containers.
    - name: kernel.task_delayacct
      value: "1"

    # Queue ingress bursts from container veth pairs instead of dropping packets
    # before sockets can drain them.
    - name: net.core.netdev_max_backlog
      value: "65536"
    # Let many colocated services use deeper accept queues during deploy and
    # restart spikes.
    - name: net.core.somaxconn
      value: "65536"

    # Allow the host kernel to route IPv4 packets for container bridges and gateways.
    - name: net.ipv4.ip_forward
      value: "1"
    # Widen ephemeral ports so NATed containers do not exhaust outbound source ports.
    - name: net.ipv4.ip_local_port_range
      value: "1024 65535"
    # Trust local rootless workloads to claim service ports so they do not need
    # CAP_NET_BIND_SERVICE just to listen on privileged ports such as 80/443.
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"
    # Delay neighbor-cache cleanup until ordinary container ARP churn exceeds the
    # expected baseline for a dense bridge host.
    - name: net.ipv4.neigh.default.gc_thresh1
      value: "2048"
    # Treat thousands of bridge peers as normal pressure so transient scale-ups
    # do not purge healthy ARP entries.
    - name: net.ipv4.neigh.default.gc_thresh2
      value: "4096"
    # Leave a higher hard cap so dense container networks do not lose reachability
    # when ARP tables fill.
    - name: net.ipv4.neigh.default.gc_thresh3
      value: "8192"
    # Free FIN-WAIT-2 sockets faster so high-churn services do not pin dead connections.
    - name: net.ipv4.tcp_fin_timeout
      value: "15"
    # Probe idle TCP connections sooner so dead peers release resources quickly.
    - name: net.ipv4.tcp_keepalive_intvl
      value: "30"
    # Limit keepalive retries so dead connections fail within operational health windows.
    - name: net.ipv4.tcp_keepalive_probes
      value: "5"
    # Start TCP keepalive after minutes instead of hours for long-lived container connections.
    - name: net.ipv4.tcp_keepalive_time
      value: "600"
    # Give proxies and edge services deeper half-open queues so SYN bursts do not
    # fail during short traffic spikes.
    - name: net.ipv4.tcp_max_syn_backlog
      value: "65536"
    # Enable SYN cookies on backlog overflow so internet-facing services resist SYN floods.
    - name: net.ipv4.tcp_syncookies
      value: "1"
    # Reuse safe TIME-WAIT sockets so high-outbound workloads avoid ephemeral-port starvation.
    - name: net.ipv4.tcp_tw_reuse
      value: "1"

    # Accept IPv6 router advertisements even while forwarding, preserving provider SLAAC.
    - name: net.ipv6.conf.all.accept_ra
      value: "2"
    # Allow the host kernel to route IPv6 packets for container bridges and gateways.
    - name: net.ipv6.conf.all.forwarding
      value: "1"
    # Make future IPv6 interfaces keep SLAAC even when container forwarding is enabled.
    - name: net.ipv6.conf.default.accept_ra
      value: "2"
    # Apply routing behavior to interfaces created after boot, including container
    # bridge and gateway devices.
    - name: net.ipv6.conf.default.forwarding
      value: "1"

    # Hold more NAT flow state so high-fan-out container egress does not start
    # dropping new connections.
    - name: net.netfilter.nf_conntrack_max
      value: "1048576"

    # Permit rootless containers and build sandboxes to isolate users without
    # falling back to privileged runtime mode.
    - name: user.max_user_namespaces
      value: "15000"

    # Allow mmap-heavy services such as Elasticsearch, databases, and JVMs to run
    # in containers without hitting host VMA ceilings.
    - name: vm.max_map_count
      value: "262144"
    # Keep a small free-memory reserve so the VM avoids reclaim deadlocks under pressure.
    - name: vm.min_free_kbytes
      value: "131072"
    # Favor container-style optimistic reservations; actual pressure is handled
    # later by cgroups and OOM policy.
    - name: vm.overcommit_memory
      value: "1"
    # Do not panic the VM on OOM; let cgroup and userspace OOM handling run first.
    - name: vm.panic_on_oom
      value: "0"
    # Prefer keeping application pages in RAM instead of swapping active container memory.
    - name: vm.swappiness
      value: "10"
  loop_control:
    label: "{{ item.name }}"

- name: Kernel | Configure PAM limits
  become: true
  community.general.pam_limits:
    domain: "*"
    limit_item: "{{ item.name }}"
    limit_type: "{{ item.type }}"
    # Keep session limits high enough for dense workers without making mistakes
    # unlimited for every login context.
    value: 65536
  tags: kernel
  loop:
    # Keep PAM-launched sessions from retaining low descriptor defaults after
    # raising kernel FD ceilings.
    - name: nofile
      type: soft
    - name: nofile
      type: hard
    # Keep login shells and user services from hitting per-session limits before
    # host PID capacity.
    - name: nproc
      type: soft
    - name: nproc
      type: hard
  loop_control:
    label: "{{ item.type }} {{ item.name }}"

# Keep THP opt-in rather than globally disabled: runtimes that benefit can
# request huge pages with madvise, while databases and low-latency services avoid
# surprise page compaction. A systemd one-shot owns this policy because the
# kernel exposes THP through sysfs rather than sysctl.
- name: Kernel | Create transparent hugepages policy service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/transparent-hugepages-madvise.service
    content: |
      [Unit]
      Description=Set Transparent Hugepages to madvise
      After=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo madvise | tee /sys/kernel/mm/transparent_hugepage/enabled'
      # Stay active after the sysfs write so systemd and Ansible treat the policy
      # as converged instead of rerunning the one-shot on every converge.
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  tags: kernel
  register: ubuntu_2604__thp_service

- name: Kernel | Start transparent hugepages policy service
  become: true
  ansible.builtin.systemd_service:
    name: transparent-hugepages-madvise
    enabled: true
    # Reload units only after the generated policy changes so idempotent runs
    # avoid needless systemd work.
    daemon_reload: "{{ ubuntu_2604__thp_service.changed }}"
    state: started
  tags: kernel

# -----------------------------------------------------------------------------
# Swap
# -----------------------------------------------------------------------------
# Swap causes unpredictable latency for container workloads and defeats OOM
# behavior expectations; disable it at runtime and persist the change.
# -----------------------------------------------------------------------------

- name: Swap | Disable active swap
  become: true
  ansible.builtin.command: swapoff -a
  changed_when: false
  tags: swap

- name: Swap | Remove swap entries from fstab
  become: true
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^.*swap.*$"
    replace: ""
    backup: true
  tags: swap

# -----------------------------------------------------------------------------
# AWS
# -----------------------------------------------------------------------------
# The role does not attempt to detect the cloud platform automatically. The
# operator must set ubuntu_2604_cloud to "aws" to enable AWS-specific tuning.
# When enabled, the role reads EC2 instance metadata to discover the region
# for regional APT mirror selection and any future AWS-aware behavior.
# -----------------------------------------------------------------------------

- name: AWS | Gather EC2 metadata facts
  amazon.aws.ec2_metadata_facts:
    # A larger token lifetime avoids intermittent failures while the module
    # walks metadata on hosts with several network interfaces or tags enabled.
    metadata_token_ttl_seconds: 240
  register: ubuntu_2604__ec2_metadata_facts
  when: ubuntu_2604_cloud == "aws"
  failed_when: false
  changed_when: false
  tags: aws

- name: AWS | Select region
  ansible.builtin.set_fact:
    ubuntu_2604__aws_region: >-
      {{
        ansible_facts.get('ec2_instance_identity_document_region', '')
        if (
          ansible_facts.get('ec2_instance_identity_document_region', '')
          is match('^[a-z]{2}(?:-gov)?(?:-[a-z]+)+-[0-9]+$')
        )
        else ''
      }}
  when: ubuntu_2604_cloud == "aws"
  tags: aws

# -----------------------------------------------------------------------------
# APT
# -----------------------------------------------------------------------------
# Ubuntu cloud images normally let cloud-init choose the archive. The role takes
# ownership after boot so package resolution is deterministic, avoids runtime
# fastest-mirror probing, and keeps EC2 hosts close to their regional archive
# while preserving Canonical-operated endpoints as outage fallbacks.
# -----------------------------------------------------------------------------

# Prefer AWS's regional Ubuntu mirror when the instance region is known because
# it is the image-default path on EC2; keep the official archive second so a
# regional DNS, sync, or reachability issue does not block provisioning.
- name: APT | Configure mirror list
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/ubuntu-mirrors.txt
    content: |
      {% if ubuntu_2604__aws_region | default('') | length > 0 %}
      http://{{ ubuntu_2604__aws_region }}.ec2.archive.ubuntu.com/ubuntu/	priority:1
      http://archive.ubuntu.com/ubuntu/	priority:2
      {% else %}
      http://archive.ubuntu.com/ubuntu/	priority:1
      {% endif %}
    mode: "0644"
  tags: apt
  register: ubuntu_2604__apt_primary_mirrors

# Security uses its own list so fallback preserves Ubuntu's dedicated security
# endpoint. The main archive remains last because it currently carries security
# suites too, but should only be used after the preferred security paths fail.
- name: APT | Configure security mirror list
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/ubuntu-security-mirrors.txt
    content: |
      {% if ubuntu_2604__aws_region | default('') | length > 0 %}
      http://{{ ubuntu_2604__aws_region }}.ec2.archive.ubuntu.com/ubuntu/	priority:1
      http://security.ubuntu.com/ubuntu/	priority:2
      http://archive.ubuntu.com/ubuntu/	priority:3
      {% else %}
      http://security.ubuntu.com/ubuntu/	priority:1
      http://archive.ubuntu.com/ubuntu/	priority:2
      {% endif %}
    mode: "0644"
  tags: apt
  register: ubuntu_2604__apt_security_mirrors

- name: APT | Configure Ubuntu archive sources
  become: true
  ansible.builtin.template:
    src: ubuntu.sources.j2
    dest: /etc/apt/sources.list.d/ubuntu.sources
    mode: "0644"
  tags: apt
  register: ubuntu_2604__apt_sources

- name: APT | Update package cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    # Source changes need a forced refresh because the previous cache may still
    # be fresh for the old mirror set; otherwise reuse metadata briefly so
    # repeated role runs do not hammer mirrors during routine provisioning.
    cache_valid_time: >-
      {{
        0
        if (
          ubuntu_2604__apt_primary_mirrors is changed
          or ubuntu_2604__apt_security_mirrors is changed
          or ubuntu_2604__apt_sources is changed
        )
        else 3600
      }}
  # Cache refreshes are preconditions, not managed host state, so they should
  # not make every converge look like configuration drift.
  changed_when: false
  tags: apt

- name: APT | Upgrade packages and clean unused package data
  become: true
  ansible.builtin.apt:
    # Apply upgrades that do not remove installed packages, keeping rebuilt VMs
    # current without accepting disruptive dependency changes during role runs.
    upgrade: safe
    # Remove orphaned dependencies so image defaults and prior provisioning do
    # not leave packages that compete with container workloads for disk space.
    autoremove: true
    # Drop obsolete package files while keeping reusable cache entries, which
    # protects small VM disks without forcing every later install to redownload.
    autoclean: true
  tags: [apt, upgrade, packages]

# -----------------------------------------------------------------------------
# Unattended upgrades
# -----------------------------------------------------------------------------
# Fresh Ubuntu servers normally enable security updates, but image pipelines and
# derivative images can remove the package or periodic APT switches. Make the
# security-update path explicit while blocking unattended reboots and daemon
# restarts; workload disruption should happen only inside an orchestrated
# maintenance window.
# -----------------------------------------------------------------------------

- name: Unattended upgrades | Install unattended upgrades package
  become: true
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  tags: [unattended_upgrades, packages]

- name: Unattended upgrades | Enable periodic security upgrades
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"
  tags: unattended_upgrades

- name: Unattended upgrades | Disable unattended reboot behavior
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52ubuntu-2604-unattended-upgrades
    content: |
      // Production container hosts must not reboot themselves outside the
      // maintenance process, even after kernel or libc security updates.
      Unattended-Upgrade::Automatic-Reboot "false";
      // Keep the no-reboot policy explicit for hosts with active or inactive
      // login sessions; maintenance automation owns reboot decisions.
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
      // Shutdown-time installs make controlled stops unpredictable and can
      // extend replacement or recovery workflows.
      Unattended-Upgrade::InstallOnShutdown "false";
    mode: "0644"
  tags: unattended_upgrades

- name: Unattended upgrades | Create needrestart override directory
  become: true
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    mode: "0755"
  tags: unattended_upgrades

- name: Unattended upgrades | Disable needrestart automatic service restarts
  become: true
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/99-ubuntu-2604-no-auto-restarts.conf
    content: |
      # Keep needrestart in list-only mode so unattended-upgrades can report
      # stale processes without restarting container runtimes, databases, or
      # workload services outside an operator-controlled maintenance window.
      $nrconf{restart} = 'l';
    mode: "0644"
  tags: unattended_upgrades

- name: Unattended upgrades | Enable APT maintenance timers
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  tags: unattended_upgrades
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# -----------------------------------------------------------------------------
# Packages
# -----------------------------------------------------------------------------
# Minimal cloud images often omit day-two troubleshooting tools. Install a small
# operator toolbox explicitly so admins can inspect processes, filesystems, DNS,
# HTTP endpoints, and network paths without changing the host's boot, kernel, or
# package-management policy.
# -----------------------------------------------------------------------------

- name: Packages | Install operational tools
  become: true
  ansible.builtin.apt:
    name:
      # Provide dig, host, and nslookup for diagnosing resolver and authoritative DNS issues.
      - bind9-dnsutils
      # Exercise HTTP APIs, metadata endpoints, and service health checks from the host.
      - curl
      # Report the instance's public IP through several external and STUN-based methods.
      - exip
      # Inspect live CPU, memory, and process behavior during incidents.
      - htop
      # Attribute disk I/O pressure to specific processes when the instance becomes storage-bound.
      - iotop
      # Parse JSON from cloud metadata, APIs, logs, and CLI output without copying data elsewhere.
      - jq
      # Page long logs and command output without flooding the terminal or losing searchability.
      - less
      # Map open files, sockets, and deleted-but-open files back to owning processes.
      - lsof
      # Capture packets when routing, firewall, or application-level traces are insufficient.
      - tcpdump
      # Keep long-running maintenance sessions resilient to SSH disconnects.
      - tmux
      # Show network hop paths so operators can localize reachability and routing failures.
      - traceroute
      # Display directory structure quickly when inspecting mounted volumes or config trees.
      - tree
      # Unpack common vendor bundles, support artifacts, and release downloads.
      - unzip
      # Fetch files and artifacts with a simple noninteractive downloader.
      - wget
    state: present
    install_recommends: false
  tags: packages

# -----------------------------------------------------------------------------
# Locale
# -----------------------------------------------------------------------------
# Container tools and editors expect a consistent UTF-8 environment; ensure the
# locale is generated and set as the system default.
# -----------------------------------------------------------------------------

# Minimal and cloud images (including AWS) do not ship the locales package by
# default, so locale-gen would fail silently without it.
- name: Locale | Install locales package
  become: true
  ansible.builtin.apt:
    name: locales
    state: present
  tags: [locale, packages]

- name: Locale | Generate system locale
  become: true
  community.general.locale_gen:
    name: "{{ ubuntu_2604_locale }}"
    state: present
  tags: locale

- name: Locale | Set default locale
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANG="
    line: "LANG={{ ubuntu_2604_locale }}"
    create: true
    mode: "0644"
  tags: locale

# -----------------------------------------------------------------------------
# Time
# -----------------------------------------------------------------------------
# Container hosts must log in UTC so timestamps are consistent across regions
# and correlate cleanly between orchestrators, runtimes, and remote collectors.
# Ubuntu 26.04 uses chrony as its default NTP client with NTS enabled; the role
# leaves the NTP configuration untouched and only enforces the timezone.
# -----------------------------------------------------------------------------

- name: Time | Set timezone to UTC
  become: true
  community.general.timezone:
    name: "{{ ubuntu_2604_timezone }}"
  tags: time

- name: Time | Ensure chrony time synchronization is active
  become: true
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true
  tags: time

# -----------------------------------------------------------------------------
# DNS
# -----------------------------------------------------------------------------
# Ubuntu 26.04 resolves through systemd-resolved.  DHCP-supplied DNS must stay
# primary because the VM may live in a network with internal zones, but if the
# lease expires or the interface is down the host still needs a working path.
# FallbackDNS is only consulted when no per-link servers are known, so setting
# it here does not interfere with DHCP-provided resolvers.
# -----------------------------------------------------------------------------

- name: DNS | Ensure systemd-resolved is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: started
    enabled: true
  tags: dns

- name: DNS | Ensure /etc/resolv.conf points to the systemd stub
  become: true
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  tags: dns
  notify: Restart systemd-resolved

- name: DNS | Ensure resolved.conf.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  tags: dns

- name: DNS | Configure fallback DNS servers
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/60-ubuntu-2604-fallback-dns.conf
    content: |
      [Resolve]
      FallbackDNS=1.1.1.1 1.0.0.1
    mode: "0644"
  tags: dns
  notify: Restart systemd-resolved

# -----------------------------------------------------------------------------
# MOTD
# -----------------------------------------------------------------------------
# Ubuntu cloud images ship a noisy dynamic MOTD (landscape stats, Canonical
# ads, update counts, ESM upsells).  Container workers do not need a welcome
# message on every SSH login; removing the source files suppresses it cleanly.
# The cached /run/motd.dynamic is also removed so the effect is immediate
# without waiting for a reboot (it lives on tmpfs and would disappear anyway).
# -----------------------------------------------------------------------------

- name: MOTD | Remove MOTD source files
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  tags: motd
  loop:
    - /etc/motd
    - /etc/motd.d
    - /etc/update-motd.d
    - /run/motd.dynamic
