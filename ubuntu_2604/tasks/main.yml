---
# -----------------------------------------------------------------------------
# Prerequisite
# -----------------------------------------------------------------------------
# Settle boot-time initialization and fail before mutation so unsupported images
# do not get partial policy.
# -----------------------------------------------------------------------------

- name: Prerequisite | Assert OS is Ubuntu 26.04
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_version'] == "26.04"
    fail_msg: >-
      This role requires Ubuntu 26.04
      (detected {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})
    success_msg: "OS check passed: Ubuntu 26.04"

- name: Prerequisite | Assert architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ["x86_64", "aarch64"]
    fail_msg: >-
      This role requires amd64 or arm64 architecture
      (detected {{ ansible_facts['architecture'] }})
    success_msg: "Architecture check passed: {{ ansible_facts['architecture'] }}"

- name: Prerequisite | Get cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: ubuntu_2604__cloud_init

- name: Prerequisite | Wait for cloud-init to finish
  ansible.builtin.command:
    argv:
      - timeout
      - "1800"
      - /usr/bin/cloud-init
      - status
      - --wait
  register: ubuntu_2604__cloud_init_timeout
  # Exit code 2 means cloud-init finished with recoverable errors; it is no longer holding boot-time APT work.
  failed_when: ubuntu_2604__cloud_init_timeout.rc not in [0, 2]
  changed_when: false
  when: ubuntu_2604__cloud_init.stat.exists

# -----------------------------------------------------------------------------
# Kernel
# -----------------------------------------------------------------------------
# Container-worker VMs need routing, density, observability, and auto-recovery
# defaults instead of general-purpose Ubuntu conservatism.
# -----------------------------------------------------------------------------

- name: Kernel | Load container kernel modules
  become: true
  community.general.modprobe:
    name: "{{ item }}"
    persistent: present
    state: present
  tags: kernel
  loop:
    # Load bridge netfilter early so bridge sysctls exist on minimal images.
    - br_netfilter
    # Load conntrack before runtimes so NAT sizing takes effect.
    - nf_conntrack
    # Require OverlayFS explicitly for overlay snapshotters.
    - overlay

- name: Kernel | Configure sysctls
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-ubuntu-2604.conf
    state: present
    reload: true
  tags: kernel
  loop:
    # Route bridged container traffic through host firewall policy.
    - name: net.bridge.bridge-nf-call-arptables
      value: "1"
    - name: net.bridge.bridge-nf-call-ip6tables
      value: "1"
    - name: net.bridge.bridge-nf-call-iptables
      value: "1"

    # Size the host FD pool so dense containers do not exhaust descriptors.
    - name: fs.file-max
      value: "2097152"
    # Raise inotify for source-tree watchers and reload bursts.
    - name: fs.inotify.max_queued_events
      value: "32768"
    - name: fs.inotify.max_user_instances
      value: "512"
    - name: fs.inotify.max_user_watches
      value: "524288"
    # Let PAM/systemd FD raises reach the host descriptor ceiling.
    - name: fs.nr_open
      value: "2097152"

    # Reboot 10s after panic so cattle VMs recover without console access.
    - name: kernel.panic
      value: "10"
    # Panic on kernel faults rather than keep unreliable network/storage state.
    - name: kernel.panic_on_oops
      value: "1"
    # Raise global PID space so cgroups, not host PID max, bound dense workers.
    - name: kernel.pid_max
      value: "4194304"
    # Account per-task delay so noisy containers can be diagnosed.
    - name: kernel.task_delayacct
      value: "1"

    # Buffer veth ingress bursts instead of dropping before sockets drain.
    - name: net.core.netdev_max_backlog
      value: "65536"
    # Deepen accept queues for deploy/restart spikes across colocated services.
    - name: net.core.somaxconn
      value: "65536"

    # Let container bridges route IPv4 even when the VM is otherwise not a router.
    - name: net.ipv4.ip_forward
      value: "1"
    # Widen ephemeral ports so NATed containers do not exhaust outbound source ports.
    - name: net.ipv4.ip_local_port_range
      value: "1024 65535"
    # Let rootless services bind 80/443 without CAP_NET_BIND_SERVICE.
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"
    # Raise neighbor cache for bridge scale-up without ARP eviction.
    - name: net.ipv4.neigh.default.gc_thresh1
      value: "2048"
    - name: net.ipv4.neigh.default.gc_thresh2
      value: "4096"
    - name: net.ipv4.neigh.default.gc_thresh3
      value: "8192"
    # Expire FIN-WAIT-2 faster so churn does not pin dead connections.
    - name: net.ipv4.tcp_fin_timeout
      value: "15"
    # Detect dead long-lived TCP peers within minutes so stale sockets release quickly.
    - name: net.ipv4.tcp_keepalive_intvl
      value: "30"
    - name: net.ipv4.tcp_keepalive_probes
      value: "5"
    - name: net.ipv4.tcp_keepalive_time
      value: "600"
    # Deepen SYN queues so short bursts do not fail proxies/edge services.
    - name: net.ipv4.tcp_max_syn_backlog
      value: "65536"
    # Enable SYN cookies on backlog overflow so internet-facing services resist SYN floods.
    - name: net.ipv4.tcp_syncookies
      value: "1"
    # Reuse safe TIME-WAIT sockets so high-outbound workloads avoid ephemeral-port starvation.
    - name: net.ipv4.tcp_tw_reuse
      value: "1"

    # Keep provider SLAAC while routing IPv6 for present and future bridges.
    - name: net.ipv6.conf.all.accept_ra
      value: "2"
    - name: net.ipv6.conf.all.forwarding
      value: "1"
    - name: net.ipv6.conf.default.accept_ra
      value: "2"
    - name: net.ipv6.conf.default.forwarding
      value: "1"

    # Hold more NAT flows so high-fan-out egress does not drop new connections.
    - name: net.netfilter.nf_conntrack_max
      value: "1048576"

    # Allow rootless containers/build sandboxes without privileged runtime mode.
    - name: user.max_user_namespaces
      value: "15000"

    # Allow mmap-heavy services such as Elasticsearch, databases, and JVMs to run
    # in containers without hitting host VMA ceilings.
    - name: vm.max_map_count
      value: "262144"
    # Reserve free memory to avoid reclaim deadlocks under pressure.
    - name: vm.min_free_kbytes
      value: "131072"
    # Use optimistic reservations because cgroups/OOM policy handle real pressure.
    - name: vm.overcommit_memory
      value: "1"
    # Do not panic the VM on OOM; let cgroup and userspace OOM handling run first.
    - name: vm.panic_on_oom
      value: "0"
    # Prefer keeping application pages in RAM instead of swapping active container memory.
    - name: vm.swappiness
      value: "10"
  loop_control:
    label: "{{ item.name }}"

- name: Kernel | Configure PAM limits
  become: true
  community.general.pam_limits:
    domain: "*"
    limit_item: "{{ item.name }}"
    limit_type: "{{ item.type }}"
    # Keep session limits high enough for dense workers without making mistakes
    # unlimited for every login context.
    value: 65536
  tags: kernel
  loop:
    # Keep PAM-launched sessions from retaining low descriptor defaults after
    # raising kernel FD ceilings.
    - name: nofile
      type: soft
    - name: nofile
      type: hard
    # Keep login shells and user services from hitting per-session limits before
    # host PID capacity.
    - name: nproc
      type: soft
    - name: nproc
      type: hard
  loop_control:
    label: "{{ item.type }} {{ item.name }}"

# Keep THP opt-in: runtimes can request it, while databases and low-latency
# services avoid surprise compaction. Use a one-shot because THP is sysfs-only.
- name: Kernel | Create transparent hugepages policy service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/transparent-hugepages-madvise.service
    content: |
      [Unit]
      Description=Set Transparent Hugepages to madvise
      After=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo madvise | tee /sys/kernel/mm/transparent_hugepage/enabled'
      # Stay active so Ansible sees the sysfs policy as converged.
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  tags: kernel
  register: ubuntu_2604__thp_service

- name: Kernel | Start transparent hugepages policy service
  become: true
  ansible.builtin.systemd_service:
    name: transparent-hugepages-madvise
    enabled: true
    # Reload units only when the generated policy changes.
    daemon_reload: "{{ ubuntu_2604__thp_service.changed }}"
    state: started
  tags: kernel

# -----------------------------------------------------------------------------
# Systemd
# -----------------------------------------------------------------------------
# PAM misses system-manager services; manager defaults give runtimes density
# headroom while cgroup accounting stays useful for noisy-container diagnosis.
# -----------------------------------------------------------------------------

- name: Systemd | Ensure system manager drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: systemd

- name: Systemd | Configure container density defaults
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/60-ubuntu-2604-density.conf
    content: |
      [Manager]
      # Keep service-launched workloads aligned with the kernel and PAM file
      # descriptor ceilings instead of inheriting low package defaults.
      DefaultLimitNOFILE=65536
      # Give service process trees the same headroom as login sessions so dense
      # workers hit explicit cgroup policy before systemd's manager default.
      DefaultLimitNPROC=65536
      DefaultTasksMax=65536

      # CPU usage is always accounted on Ubuntu 26.04's unified cgroup stack;
      # keep memory and task accounting explicit so runtime-agnostic host tools
      # can attribute pressure to service units.
      DefaultMemoryAccounting=yes
      DefaultTasksAccounting=yes
    mode: "0644"
  tags: systemd
  notify: Reexec systemd manager

# Re-exec before runtimes start so same-play services inherit new defaults.
- name: Systemd | Apply manager default changes
  ansible.builtin.meta: flush_handlers
  tags: systemd

# -----------------------------------------------------------------------------
# Swap
# -----------------------------------------------------------------------------
# Disable swap because host paging undermines container latency and OOM policy.
# -----------------------------------------------------------------------------

- name: Swap | Disable active swap
  become: true
  ansible.builtin.command: swapoff -a
  changed_when: false
  tags: swap

- name: Swap | Remove swap entries from fstab
  become: true
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^.*swap.*$"
    replace: ""
    backup: true
  tags: swap

# -----------------------------------------------------------------------------
# AWS
# -----------------------------------------------------------------------------
# AWS tuning is opt-in; metadata supplies region only after the operator declares
# the platform.
# -----------------------------------------------------------------------------

- name: AWS | Gather EC2 metadata facts
  amazon.aws.ec2_metadata_facts:
    # Longer IMDS token TTL prevents multi-interface/tag walks from expiring.
    metadata_token_ttl_seconds: 240
  register: ubuntu_2604__ec2_metadata_facts
  when: ubuntu_2604_cloud == "aws"
  failed_when: false
  changed_when: false
  tags: aws

- name: AWS | Select region
  ansible.builtin.set_fact:
    ubuntu_2604__aws_region: >-
      {{
        ansible_facts.get('ec2_instance_identity_document_region', '')
        if (
          ansible_facts.get('ec2_instance_identity_document_region', '')
          is match('^[a-z]{2}(?:-gov)?(?:-[a-z]+)+-[0-9]+$')
        )
        else ''
      }}
  when: ubuntu_2604_cloud == "aws"
  tags: aws

# -----------------------------------------------------------------------------
# APT
# -----------------------------------------------------------------------------
# Own mirrors after cloud-init for deterministic APT without runtime probing.
# Ubuntu 26.04 serves arm64 from normal archive/security endpoints. Keep
# Canonical endpoints first because stale regional indexes can reference files
# already removed from the pool.
# -----------------------------------------------------------------------------

# Keep EC2 mirrors fallback-only; stale regional indexes can make a good archive
# look broken.
- name: APT | Configure mirror list
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/ubuntu-mirrors.txt
    content: |
      {% if ubuntu_2604__aws_region | default('') | length > 0 %}
      http://archive.ubuntu.com/ubuntu/	priority:1
      http://{{ ubuntu_2604__aws_region }}.ec2.archive.ubuntu.com/ubuntu/	priority:2
      {% else %}
      http://archive.ubuntu.com/ubuntu/	priority:1
      {% endif %}
    mode: "0644"
  tags: apt
  register: ubuntu_2604__apt_primary_mirrors

# Make security.ubuntu.com authoritative; archive.ubuntu.com is a safer fallback
# than lagging regional mirrors.
- name: APT | Configure security mirror list
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/ubuntu-security-mirrors.txt
    content: |
      {% if ubuntu_2604__aws_region | default('') | length > 0 %}
      http://security.ubuntu.com/ubuntu/	priority:1
      http://archive.ubuntu.com/ubuntu/	priority:2
      http://{{ ubuntu_2604__aws_region }}.ec2.archive.ubuntu.com/ubuntu/	priority:3
      {% else %}
      http://security.ubuntu.com/ubuntu/	priority:1
      http://archive.ubuntu.com/ubuntu/	priority:2
      {% endif %}
    mode: "0644"
  tags: apt
  register: ubuntu_2604__apt_security_mirrors

- name: APT | Configure Ubuntu archive sources
  become: true
  ansible.builtin.template:
    src: ubuntu.sources.j2
    dest: /etc/apt/sources.list.d/ubuntu.sources
    mode: "0644"
  tags: apt
  register: ubuntu_2604__apt_sources

- name: APT | Update package cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    # Force refresh after source changes; otherwise reuse recent metadata to spare mirrors.
    cache_valid_time: >-
      {{
        0
        if (
          ubuntu_2604__apt_primary_mirrors is changed
          or ubuntu_2604__apt_security_mirrors is changed
          or ubuntu_2604__apt_sources is changed
        )
        else 3600
      }}
  # Cache refreshes are preconditions, not configuration drift.
  changed_when: false
  tags: apt

- name: APT | Upgrade packages and clean unused package data
  become: true
  ansible.builtin.apt:
    # Wait out cloud-init/unattended APT startup work instead of failing on dpkg locks.
    lock_timeout: 600
    # Use safe upgrades to keep rebuilt VMs current without removals.
    upgrade: safe
    # Remove orphans so old image/provisioning packages stop consuming disk.
    autoremove: true
    # Drop obsolete downloads while preserving cache entries useful later.
    autoclean: true
  tags: [apt, upgrade, packages]

- name: APT | Check reboot requirement marker
  become: true
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: ubuntu_2604__reboot_required
  tags: [apt, upgrade]

- name: APT | Read reboot requirement packages
  become: true
  ansible.builtin.command: cat /var/run/reboot-required.pkgs
  register: ubuntu_2604__reboot_required_packages
  failed_when: false
  changed_when: false
  when: ubuntu_2604__reboot_required.stat.exists
  tags: [apt, upgrade]

- name: APT | Report reboot requirement
  ansible.builtin.debug:
    msg:
      - Host reboot is required after package upgrades.
      - >-
        Packages: {{ ubuntu_2604__reboot_required_packages.stdout_lines | default([]) | join(', ') }}
  when: ubuntu_2604__reboot_required.stat.exists
  tags: [apt, upgrade]

# -----------------------------------------------------------------------------
# Unattended upgrades
# -----------------------------------------------------------------------------
# Image pipelines may strip security timers; restore them but keep reboots/restarts
# inside maintenance windows.
# -----------------------------------------------------------------------------

- name: Unattended upgrades | Install unattended upgrades package
  become: true
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  tags: [unattended_upgrades, packages]

- name: Unattended upgrades | Enable periodic security upgrades
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"
  tags: unattended_upgrades

- name: Unattended upgrades | Disable unattended reboot behavior
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52ubuntu-2604-unattended-upgrades
    content: |
      // Reserve reboots/shutdown installs for maintenance automation, not background APT.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
      Unattended-Upgrade::InstallOnShutdown "false";
    mode: "0644"
  tags: unattended_upgrades

- name: Unattended upgrades | Create needrestart override directory
  become: true
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    mode: "0755"
  tags: unattended_upgrades

- name: Unattended upgrades | Disable needrestart automatic service restarts
  become: true
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/99-ubuntu-2604-no-auto-restarts.conf
    content: |
      # List stale processes without restarting runtimes or workload services.
      $nrconf{restart} = 'l';
    mode: "0644"
  tags: unattended_upgrades

- name: Unattended upgrades | Enable APT maintenance timers
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  tags: unattended_upgrades
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# -----------------------------------------------------------------------------
# Logs
# -----------------------------------------------------------------------------
# Container hosts burst logs; keep reboot history but cap journals/free space so
# logs cannot crowd out packages or workload state.
# -----------------------------------------------------------------------------

- name: Logs | Ensure journald drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: logs

- name: Logs | Ensure persistent journal directory exists
  become: true
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  tags: logs

- name: Logs | Configure journald retention and pressure limits
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-ubuntu-2604-log-pressure.conf
    content: |
      [Journal]
      # Keep recovery history without unbounded journal growth on small disks.
      Storage=persistent
      Compress=yes
      SystemMaxUse=1G
      SystemMaxFileSize=128M
      MaxRetentionSec=30day
      MaxFileSec=1week

      # Reserve /var/log and /run space so log storms age out instead of filling the VM.
      SystemKeepFree=2G
      RuntimeMaxUse=256M
      RuntimeKeepFree=512M
    mode: "0644"
  tags: logs
  notify: Restart systemd-journald

- name: Logs | Apply journal retention to existing files
  become: true
  ansible.builtin.command: journalctl --vacuum-size=1G --vacuum-time=30d
  changed_when: false
  tags: logs

# -----------------------------------------------------------------------------
# Firewall
# -----------------------------------------------------------------------------
# Use nftables as the sole host firewall manager; ruleset ownership belongs to
# hardening or site policy.
# -----------------------------------------------------------------------------

- name: Firewall | Install netfilter tools
  become: true
  ansible.builtin.apt:
    name:
      - conntrack
      - iptables
      - nftables
    state: present
    install_recommends: false
  tags: [firewall, packages]

- name: Firewall | Use nftables-backed compatibility commands
  become: true
  community.general.alternatives:
    name: "{{ item.name }}"
    path: "{{ item.path }}"
  tags: firewall
  loop:
    - name: iptables
      path: /usr/sbin/iptables-nft
    - name: ip6tables
      path: /usr/sbin/ip6tables-nft
    - name: arptables
      path: /usr/sbin/arptables-nft
    - name: ebtables
      path: /usr/sbin/ebtables-nft
  loop_control:
    label: "{{ item.name }}"

- name: Firewall | Enable nftables service
  become: true
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
  tags: firewall

- name: Firewall | Stop and disable UFW service
  become: true
  ansible.builtin.systemd_service:
    name: ufw
    state: stopped
    enabled: false
  tags: firewall

- name: Firewall | Mask UFW service
  become: true
  ansible.builtin.systemd_service:
    name: ufw
    masked: true
  tags: firewall

# -----------------------------------------------------------------------------
# Packages
# -----------------------------------------------------------------------------
# Install a small day-two toolbox so incident response does not start with
# package changes.
# -----------------------------------------------------------------------------

- name: Packages | Install operational tools
  become: true
  ansible.builtin.apt:
    name:
      - bind9-dnsutils
      - curl
      - exip
      - htop
      - iotop
      - jq
      - less
      - lsof
      - tcpdump
      - tmux
      - traceroute
      - tree
      - unzip
      - wget
    state: present
    install_recommends: false
  tags: packages

# -----------------------------------------------------------------------------
# SSH
# -----------------------------------------------------------------------------
# Put recovery-path hardening in a 00-* drop-in so it precedes cloud-init/package
# snippets without rewriting sshd_config.
# -----------------------------------------------------------------------------

- name: SSH | Install OpenSSH server
  become: true
  ansible.builtin.apt:
    name: openssh-server
    state: present
    install_recommends: false
  tags: [ssh, packages]

- name: SSH | Ensure sshd runtime directory exists
  become: true
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ssh

- name: SSH | Ensure sshd drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ssh

- name: SSH | Hardening | Configure sshd_config permissions
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
  tags: ssh

- name: SSH | Hardening | Find private host key files
  become: true
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: "ssh_host_*_key"
    excludes: "*.pub"
  tags: ssh
  register: ubuntu_2604__ssh_private_key_files

- name: SSH | Hardening | Configure private host key permissions
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  tags: ssh
  loop: "{{ ubuntu_2604__ssh_private_key_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: SSH | Hardening | Find public host key files
  become: true
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: "ssh_host_*.pub"
  tags: ssh
  register: ubuntu_2604__ssh_public_key_files

- name: SSH | Hardening | Configure public host key permissions
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0644"
  tags: ssh
  loop: "{{ ubuntu_2604__ssh_public_key_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: SSH | Hardening | Configure priority drop-in
  become: true
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ubuntu-2604-hardening.conf
    content: |
      # 00-* wins over later cloud-init/package snippets.
      # Verbose auth logs aid SSH recovery without debug noise.
      LogLevel VERBOSE

      # Use keys only while preserving PAM session policy.
      LoginGraceTime 60
      MaxAuthTries 3
      PasswordAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin {{ ubuntu_2604_ssh_allow_root_login | bool | ternary('yes', 'no') }}
      PubkeyAuthentication yes
      UsePAM yes

      # Disable legacy trust paths and user-controlled environment injection.
      HostbasedAuthentication no
      IgnoreRhosts yes
      PermitUserEnvironment no

      # Pin a small audited algorithm set.
      Ciphers aes256-ctr,aes192-ctr,aes128-ctr
      HostKeyAlgorithms ecdsa-sha2-nistp521,ecdsa-sha2-nistp384,ecdsa-sha2-nistp256
      KexAlgorithms ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256
      MACs hmac-sha2-512,hmac-sha2-256

      # Bound idle sessions and unauthenticated bursts to limit brute-force cost.
      ClientAliveCountMax 0
      ClientAliveInterval 300
      MaxSessions 3
      MaxStartups 10:30:60

      # Avoid unaudited tunnels and desktop forwarding on workers.
      AllowTcpForwarding {{ ubuntu_2604_ssh_allow_tcp_forwarding | bool | ternary('yes', 'no') }}
      Banner none
      X11Forwarding no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  tags: ssh
  notify: Restart OpenSSH

- name: SSH | Hardening | Validate sshd configuration
  become: true
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  tags: ssh

- name: SSH | Ensure OpenSSH service is active
  become: true
  ansible.builtin.systemd_service:
    name: ssh
    state: started
    enabled: true
  tags: ssh

# -----------------------------------------------------------------------------
# Locale
# -----------------------------------------------------------------------------
# Set a UTF-8 locale so minimal images do not leak C/POSIX into Unicode paths/logs.
# -----------------------------------------------------------------------------

# Minimal/cloud images may omit locales; install it before locale_gen.
- name: Locale | Install locales package
  become: true
  ansible.builtin.apt:
    name: locales
    state: present
  tags: [locale, packages]

- name: Locale | Generate system locale
  become: true
  community.general.locale_gen:
    name: "{{ ubuntu_2604_locale }}"
    state: present
  tags: locale

- name: Locale | Set default locale
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANG="
    line: "LANG={{ ubuntu_2604_locale }}"
    create: true
    mode: "0644"
  tags: locale

# -----------------------------------------------------------------------------
# Time
# -----------------------------------------------------------------------------
# Use UTC for cross-region log correlation; keep Ubuntu's chrony stack.
# -----------------------------------------------------------------------------

- name: Time | Set timezone to UTC
  become: true
  community.general.timezone:
    name: "{{ ubuntu_2604_timezone }}"
  tags: time

- name: Time | Ensure chrony time synchronization is active
  become: true
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true
  tags: time

# -----------------------------------------------------------------------------
# DNS
# -----------------------------------------------------------------------------
# Keep DHCP DNS primary for internal zones; FallbackDNS only covers links with
# no known servers.
# -----------------------------------------------------------------------------

- name: DNS | Ensure systemd-resolved is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: started
    enabled: true
  tags: dns

- name: DNS | Ensure /etc/resolv.conf points to the systemd stub
  become: true
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  tags: dns
  notify: Restart systemd-resolved

- name: DNS | Ensure resolved.conf.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  tags: dns

- name: DNS | Configure fallback DNS servers
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/60-ubuntu-2604-fallback-dns.conf
    content: |
      [Resolve]
      FallbackDNS=1.1.1.1 1.0.0.1
    mode: "0644"
  tags: dns
  notify: Restart systemd-resolved

# -----------------------------------------------------------------------------
# MOTD
# -----------------------------------------------------------------------------
# Keep worker SSH logins quiet; disable vendor news while leaving MOTD installed.
# -----------------------------------------------------------------------------

- name: MOTD | Find dynamic MOTD entries
  become: true
  ansible.builtin.find:
    paths: /etc/update-motd.d
    file_type: any
  tags: motd
  register: ubuntu2604__motd

- name: MOTD | Remove dynamic MOTD entries
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  tags: motd
  loop: "{{ ubuntu2604__motd.files }}"
  when:
    - ubuntu2604__motd.files | length > 0
    - not item.isdir

- name: MOTD | Ensure update-motd.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/update-motd.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: motd

- name: MOTD | Clear static MOTD file
  become: true
  ansible.builtin.copy:
    content: ""
    dest: /etc/motd
    mode: "0644"
    owner: root
    group: root
  tags: motd

- name: MOTD | Disable motd-news timer
  become: true
  ansible.builtin.systemd_service:
    name: motd-news.timer
    state: stopped
    enabled: false
    masked: true
  tags: motd
