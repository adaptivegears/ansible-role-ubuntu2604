---
- name: Verify ubuntu_2604 role effects
  hosts: all
  gather_facts: false
  vars_files:
    - ../vars/main.yml
  vars:
    verify_ubuntu_2604_kernel_modules:
      - br_netfilter
      - nf_conntrack
      - overlay

    verify_ubuntu_2604_sysctls:
      - name: net.bridge.bridge-nf-call-arptables
        value: "1"
      - name: net.bridge.bridge-nf-call-ip6tables
        value: "1"
      - name: net.bridge.bridge-nf-call-iptables
        value: "1"
      - name: fs.file-max
        value: "2097152"
      - name: fs.inotify.max_queued_events
        value: "32768"
      - name: fs.inotify.max_user_instances
        value: "512"
      - name: fs.inotify.max_user_watches
        value: "524288"
      - name: fs.nr_open
        value: "2097152"
      - name: kernel.panic
        value: "10"
      - name: kernel.panic_on_oops
        value: "1"
      - name: kernel.pid_max
        value: "4194304"
      - name: kernel.task_delayacct
        value: "1"
      - name: net.core.netdev_max_backlog
        value: "65536"
      - name: net.core.somaxconn
        value: "65536"
      - name: net.ipv4.ip_forward
        value: "1"
      - name: net.ipv4.ip_local_port_range
        value: "1024 65535"
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"
      - name: net.ipv4.neigh.default.gc_thresh1
        value: "2048"
      - name: net.ipv4.neigh.default.gc_thresh2
        value: "4096"
      - name: net.ipv4.neigh.default.gc_thresh3
        value: "8192"
      - name: net.ipv4.tcp_fin_timeout
        value: "15"
      - name: net.ipv4.tcp_keepalive_intvl
        value: "30"
      - name: net.ipv4.tcp_keepalive_probes
        value: "5"
      - name: net.ipv4.tcp_keepalive_time
        value: "600"
      - name: net.ipv4.tcp_max_syn_backlog
        value: "65536"
      - name: net.ipv4.tcp_syncookies
        value: "1"
      - name: net.ipv4.tcp_tw_reuse
        value: "1"
      - name: net.ipv6.conf.all.accept_ra
        value: "2"
      - name: net.ipv6.conf.all.forwarding
        value: "1"
      - name: net.ipv6.conf.default.accept_ra
        value: "2"
      - name: net.ipv6.conf.default.forwarding
        value: "1"
      - name: net.netfilter.nf_conntrack_max
        value: "1048576"
      - name: user.max_user_namespaces
        value: "15000"
      - name: vm.max_map_count
        value: "262144"
      - name: vm.min_free_kbytes
        value: "131072"
      - name: vm.overcommit_memory
        value: "1"
      - name: vm.panic_on_oom
        value: "0"
      - name: vm.swappiness
        value: "10"

    verify_ubuntu_2604_pam_limits:
      - name: nofile
        type: soft
        value: "65536"
      - name: nofile
        type: hard
        value: "65536"
      - name: nproc
        type: soft
        value: "65536"
      - name: nproc
        type: hard
        value: "65536"

    verify_ubuntu_2604_fstab_swap_regex: '(?m)^\s*[^#\s]+\s+[^\s]+\s+swap\s+'

  tasks:
    # -----------------------------------------------------------------------------
    # Kernel
    # -----------------------------------------------------------------------------
    # The role prepares the host kernel for container networking and dense process
    # trees. These checks validate the observable runtime policy and the persistent
    # configuration needed for the same behavior after a reboot.
    # -----------------------------------------------------------------------------

    - name: Kernel | Inspect loaded module sysfs entries
      become: true
      ansible.builtin.stat:
        path: "/sys/module/{{ item }}"
      register: verify_kernel_module_paths
      loop: "{{ verify_ubuntu_2604_kernel_modules }}"
      loop_control:
        label: "{{ item }}"

    - name: Kernel | Assert container kernel modules are loaded
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "Kernel module {{ item.item }} is not loaded; expected /sys/module/{{ item.item }} to exist."
        success_msg: "Kernel module {{ item.item }} is loaded."
      loop: "{{ verify_kernel_module_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Kernel | Read runtime sysctl values
      become: true
      ansible.builtin.command: "sysctl -n {{ item.name }}"
      changed_when: false
      failed_when: false
      register: verify_runtime_sysctls
      loop: "{{ verify_ubuntu_2604_sysctls }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Kernel | Assert runtime sysctl values match the role contract
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - "(item.stdout | trim | regex_replace('\\s+', ' ')) == item.item.value"
        fail_msg: >-
          Runtime sysctl {{ item.item.name }} expected {{ item.item.value }}, got
          rc={{ item.rc }}, stdout={{ item.stdout | default('') | trim }},
          stderr={{ item.stderr | default('') | trim }}.
        success_msg: "Runtime sysctl {{ item.item.name }} is {{ item.item.value }}."
      loop: "{{ verify_runtime_sysctls.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Kernel | Read persistent sysctl configuration
      become: true
      ansible.builtin.slurp:
        path: /etc/sysctl.d/99-ubuntu-2604.conf
      register: verify_persistent_sysctl_file

    - name: Kernel | Assert sysctl values persist across reboot
      ansible.builtin.assert:
        that:
          - >-
            (verify_persistent_sysctl_file.content | b64decode | regex_search(
            '(?m)^\s*' ~ (item.name | regex_escape) ~ '\s*=\s*' ~
            (item.value | regex_escape) ~ '\s*(#.*)?$')) is not none
        fail_msg: "Persistent sysctl config is missing {{ item.name }} = {{ item.value }}."
        success_msg: "Persistent sysctl config contains {{ item.name }} = {{ item.value }}."
      loop: "{{ verify_ubuntu_2604_sysctls }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Kernel | Read PAM limits configuration
      become: true
      ansible.builtin.slurp:
        path: /etc/security/limits.conf
      register: verify_pam_limits_file

    - name: Kernel | Assert PAM limits match the role contract
      ansible.builtin.assert:
        that:
          - >-
            (verify_pam_limits_file.content | b64decode | regex_search(
            '(?m)^\*\s+' ~ item.type ~ '\s+' ~ item.name ~ '\s+' ~
            (item.value | regex_escape) ~ '\s*(#.*)?$')) is not none
        fail_msg: "PAM limit * {{ item.type }} {{ item.name }} {{ item.value }} is missing."
        success_msg: "PAM limit * {{ item.type }} {{ item.name }} {{ item.value }} exists."
      loop: "{{ verify_ubuntu_2604_pam_limits }}"
      loop_control:
        label: "{{ item.type }} {{ item.name }}"

    - name: Kernel | Gather systemd service facts
      become: true
      ansible.builtin.service_facts:

    - name: Kernel | Assert transparent hugepages service is active and enabled
      ansible.builtin.assert:
        that:
          - "'transparent-hugepages-madvise.service' in ansible_facts.services"
          - ansible_facts.services['transparent-hugepages-madvise.service'].state == 'running'
          - ansible_facts.services['transparent-hugepages-madvise.service'].status == 'enabled'
        fail_msg: >-
          transparent-hugepages-madvise.service should be enabled and active;
          observed {{ ansible_facts.services.get('transparent-hugepages-madvise.service', {}) }}.
        success_msg: transparent-hugepages-madvise.service is enabled and active.

    - name: Kernel | Read transparent hugepages runtime mode
      become: true
      ansible.builtin.slurp:
        path: /sys/kernel/mm/transparent_hugepage/enabled
      register: verify_thp_mode

    - name: Kernel | Assert transparent hugepages mode is madvise
      ansible.builtin.assert:
        that:
          - "'[madvise]' in (verify_thp_mode.content | b64decode)"
        fail_msg: >-
          Transparent hugepages mode should be madvise; observed
          {{ verify_thp_mode.content | b64decode | trim }}.
        success_msg: Transparent hugepages mode is madvise.

    # -----------------------------------------------------------------------------
    # Swap
    # -----------------------------------------------------------------------------
    # Container hosts should let cgroups and OOM policy handle memory pressure, so
    # swap must be absent both from the live system and from reboot-time mounts.
    # -----------------------------------------------------------------------------

    - name: Swap | Read active swap devices
      become: true
      ansible.builtin.command: swapon --show=NAME --noheadings
      changed_when: false
      failed_when: false
      register: verify_active_swap

    - name: Swap | Assert no swap is active
      ansible.builtin.assert:
        that:
          - verify_active_swap.rc == 0
          - verify_active_swap.stdout | trim | length == 0
        fail_msg: "Active swap should be disabled; observed {{ verify_active_swap.stdout_lines }}."
        success_msg: No active swap devices are present.

    - name: Swap | Read fstab
      become: true
      ansible.builtin.slurp:
        path: /etc/fstab
      register: verify_fstab_file

    - name: Swap | Assert fstab has no active swap entries
      ansible.builtin.assert:
        that:
          - >-
            (verify_fstab_file.content | b64decode |
            regex_search(verify_ubuntu_2604_fstab_swap_regex)) is none
        fail_msg: /etc/fstab should not contain uncommented swap entries.
        success_msg: /etc/fstab contains no uncommented swap entries.

    # -----------------------------------------------------------------------------
    # Locale
    # -----------------------------------------------------------------------------
    # The role standardizes the host's UTF-8 locale because build tools, editors,
    # and container CLIs often inherit the system default environment.
    # -----------------------------------------------------------------------------

    - name: Locale | Gather package facts
      become: true
      ansible.builtin.package_facts:
        manager: auto

    - name: Locale | Assert locales package is installed
      ansible.builtin.assert:
        that:
          - "'locales' in ansible_facts.packages"
        fail_msg: locales package is not installed.
        success_msg: locales package is installed.

    - name: Locale | Read generated locales
      ansible.builtin.command: locale -a
      changed_when: false
      failed_when: false
      register: verify_generated_locales

    - name: Locale | Assert configured locale is generated
      ansible.builtin.assert:
        that:
          - verify_generated_locales.rc == 0
          - >-
            (ubuntu_2604_locale | lower | regex_replace('utf-8$', 'utf8')) in
            (verify_generated_locales.stdout | lower)
        fail_msg: >-
          Locale {{ ubuntu_2604_locale }} should be generated; observed locales are
          {{ verify_generated_locales.stdout_lines }}.
        success_msg: "Locale {{ ubuntu_2604_locale }} is generated."

    - name: Locale | Read default locale configuration
      become: true
      ansible.builtin.slurp:
        path: /etc/default/locale
      register: verify_default_locale_file

    - name: Locale | Assert default locale is configured
      ansible.builtin.assert:
        that:
          - >-
            (verify_default_locale_file.content | b64decode | regex_search(
            '(?m)^LANG=' ~ (ubuntu_2604_locale | regex_escape) ~ '$')) is not none
        fail_msg: "Default locale should contain LANG={{ ubuntu_2604_locale }}."
        success_msg: "Default locale is LANG={{ ubuntu_2604_locale }}."
