---
- name: Verify ubuntu_2604 role runtime state
  hosts: all
  gather_facts: true
  vars:
    verify_locale: en_US.UTF-8
  tasks:
    - name: Verify | Kernel module br_netfilter is loaded
      become: true
      ansible.builtin.command: cat /sys/module/br_netfilter/initstate
      changed_when: false
      register: br_netfilter_state
      failed_when: br_netfilter_state.rc != 0

    - name: Verify | Kernel module nf_conntrack is loaded
      become: true
      ansible.builtin.command: cat /sys/module/nf_conntrack/initstate
      changed_when: false
      register: nf_conntrack_state
      failed_when: nf_conntrack_state.rc != 0

    - name: Verify | Kernel module overlay is loaded
      become: true
      ansible.builtin.command: cat /sys/module/overlay/initstate
      changed_when: false
      register: overlay_state
      failed_when: overlay_state.rc != 0

    - name: Verify | Runtime sysctl values
      become: true
      ansible.builtin.command: "sysctl -n {{ item.name }}"
      changed_when: false
      register: sysctl_result
      failed_when: (sysctl_result.stdout | regex_replace('\t', ' ')) != item.value
      loop:
        - { name: "net.bridge.bridge-nf-call-arptables", value: "1" }
        - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { name: "fs.file-max", value: "2097152" }
        - { name: "fs.inotify.max_queued_events", value: "32768" }
        - { name: "fs.inotify.max_user_instances", value: "512" }
        - { name: "fs.inotify.max_user_watches", value: "524288" }
        - { name: "fs.nr_open", value: "2097152" }
        - { name: "kernel.panic", value: "10" }
        - { name: "kernel.panic_on_oops", value: "1" }
        - { name: "kernel.pid_max", value: "4194304" }
        - { name: "kernel.task_delayacct", value: "1" }
        - { name: "net.core.netdev_max_backlog", value: "65536" }
        - { name: "net.core.somaxconn", value: "65536" }
        - { name: "net.ipv4.ip_forward", value: "1" }
        - { name: "net.ipv4.ip_local_port_range", value: "1024 65535" }
        - { name: "net.ipv4.ip_unprivileged_port_start", value: "0" }
        - { name: "net.ipv4.neigh.default.gc_thresh1", value: "2048" }
        - { name: "net.ipv4.neigh.default.gc_thresh2", value: "4096" }
        - { name: "net.ipv4.neigh.default.gc_thresh3", value: "8192" }
        - { name: "net.ipv4.tcp_fin_timeout", value: "15" }
        - { name: "net.ipv4.tcp_keepalive_intvl", value: "30" }
        - { name: "net.ipv4.tcp_keepalive_probes", value: "5" }
        - { name: "net.ipv4.tcp_keepalive_time", value: "600" }
        - { name: "net.ipv4.tcp_max_syn_backlog", value: "65536" }
        - { name: "net.ipv4.tcp_syncookies", value: "1" }
        - { name: "net.ipv4.tcp_tw_reuse", value: "1" }
        - { name: "net.ipv6.conf.all.accept_ra", value: "2" }
        - { name: "net.ipv6.conf.all.forwarding", value: "1" }
        - { name: "net.ipv6.conf.default.accept_ra", value: "2" }
        - { name: "net.ipv6.conf.default.forwarding", value: "1" }
        - { name: "net.netfilter.nf_conntrack_max", value: "1048576" }
        - { name: "user.max_user_namespaces", value: "15000" }
        - { name: "vm.max_map_count", value: "262144" }
        - { name: "vm.min_free_kbytes", value: "131072" }
        - { name: "vm.overcommit_memory", value: "1" }
        - { name: "vm.panic_on_oom", value: "0" }
        - { name: "vm.swappiness", value: "10" }
      loop_control:
        label: "{{ item.name }}"

    - name: Verify | PAM limits for nofile and nproc
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        grep -cE '^\*\s+(soft|hard)\s+{{ item }}\s+65536' /etc/security/limits.conf
      args:
        executable: /bin/bash
      changed_when: false
      register: pam_limits_count
      failed_when: pam_limits_count.stdout | int != 2
      loop:
        - nofile
        - nproc

    - name: Verify | Transparent hugepages service is active and enabled
      become: true
      ansible.builtin.systemd_service:
        name: transparent-hugepages-madvise
        state: started
        enabled: true
      check_mode: true
      register: thp_service_check
      failed_when: thp_service_check.changed

    - name: Verify | Transparent hugepages mode is madvise
      become: true
      ansible.builtin.command: cat /sys/kernel/mm/transparent_hugepage/enabled
      changed_when: false
      register: thp_mode
      failed_when: "'[madvise]' not in thp_mode.stdout"

    - name: Verify | Active swap is disabled
      become: true
      ansible.builtin.command: swapon --show=NAME --noheadings
      changed_when: false
      register: active_swap
      failed_when: active_swap.stdout | length > 0

    - name: Verify | No swap entries in fstab
      become: true
      ansible.builtin.command: grep -i swap /etc/fstab
      changed_when: false
      register: fstab_swap
      failed_when: fstab_swap.rc == 0

    - name: Verify | Locales package is installed
      become: true
      ansible.builtin.command: dpkg-query -W -f='${Status}' locales
      changed_when: false
      register: locales_pkg
      failed_when: "'install ok installed' not in locales_pkg.stdout"

    - name: Verify | System locale is generated
      become: true
      ansible.builtin.command: locale -a
      changed_when: false
      register: locale_gen
      failed_when: "'en_us.utf8' not in locale_gen.stdout | lower"

    - name: Verify | Default locale is set
      become: true
      ansible.builtin.command: grep '^LANG={{ verify_locale }}' /etc/default/locale
      changed_when: false
      register: default_locale
      failed_when: default_locale.rc != 0
